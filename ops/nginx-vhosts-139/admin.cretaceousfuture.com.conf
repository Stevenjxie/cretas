server {
    listen 80;
    server_name admin.cretaceousfuture.com;
    location /.well-known/acme-challenge/ { root /www/wwwroot/web-admin; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name admin.cretaceousfuture.com;
    root /www/wwwroot/web-admin;
    index index.html;

    ssl_certificate /www/server/panel/vhost/cert/admin.cretaceousfuture.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/admin.cretaceousfuture.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets on;

    location / { try_files $uri $uri/ /index.html; }

    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SSE streaming for AI Chat (mobile H5 POST via /smartbi-api/*-stream)
    location ~ ^/smartbi-api/api/chat/.*-stream$ {
        proxy_pass http://47.100.235.168:8083;
        rewrite ^/smartbi-api(/.*)$ $1 break;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        chunked_transfer_encoding on;
    }
    location /smartbi-api/ {
        proxy_pass http://47.100.235.168:8083/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 900s;
        client_max_body_size 500m;
    }

    # Mobile upload-batch-stream SSE (added Apr 16 2026 — was missing, caused 404 on domain)
    location ~ /api/mobile/.*/smart-bi/upload-batch-stream {
        proxy_pass http://cretas_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        chunked_transfer_encoding on;
        add_header X-Accel-Buffering no;
        add_header Cache-Control no-cache;
    }

    # Client requirement public submission
    location /api/public/client-requirement/ {
        charset utf-8;
        proxy_pass http://47.100.235.168:8083/api/public/client-requirement/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Content-Type $http_content_type;
        proxy_buffering off;
    }

    # Onboarding static UI (client-request wizard)
    # Mobile restaurant-AI Q&A (DEMO_REST demo)
    location ^~ /mobile-ai/rest/ {
        alias /www/wwwroot/mobile-ai/rest/;
        index index.html;
        try_files $uri $uri/ /mobile-ai/rest/index.html;
        add_header Cache-Control "no-cache";
    }

    location ^~ /onboarding/ {
        alias /www/wwwroot/client-request/;
        index index.html;
        add_header Cache-Control "no-cache";
    }

    # Console report endpoint (front-end error upload, silent 204)
    location = /api/console-report {
        access_log /www/wwwlogs/web-admin-console.log;
        client_body_buffer_size 16k;
        client_max_body_size 16k;
        return 204;
    }

    location /api/smartbi/ {
        proxy_pass http://47.100.235.168:8083/api/smartbi/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 900s;
        client_max_body_size 500m;
    }

    location /api/platform/ {
        proxy_pass http://cretas_backend/api/platform/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/admin/ {
        proxy_pass http://cretas_backend/api/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # === Phase 2A + Phase IIa SmartBI routing (synced from web-admin.conf 2026-05-15) ===
    # Reason: admin.cretaceousfuture.com.conf was missing 5 blocks that web-admin.conf has.
    # Real customers hit this DNS, internal tests hit web-admin.conf:8086. Both must stay in sync.
    # Track sync via doc: docs/superpowers/runbooks/nginx-vhost-sync-checklist.md

    # SmartBI Python routing — shared across 3 vhosts (snippets/smart-bi-routing.conf)
    include /www/server/nginx/conf/snippets/smart-bi-routing.conf;

    location /api/mobile/ {
        proxy_pass http://cretas_backend/api/mobile/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 900s;
        client_max_body_size 500m;
    }

    location /api/public/ {
        proxy_pass http://cretas_backend/api/public/;
    }
}
