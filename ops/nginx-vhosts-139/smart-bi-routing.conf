# Shared SmartBI Python routing — included by 3 vhosts (web-admin.conf,
# admin.cretaceousfuture.com.conf, api.cretaceousfuture.com.conf).
#
# Single source of truth — edit here once, all 3 vhosts pick up via include.
# Created 2026-05-15 to permanently fix vhost drift per
# docs/superpowers/runbooks/nginx-vhost-sync-checklist.md incident.
#
# ============================================================================
# SCOPE — IMPORTANT, READ BEFORE EDITING
# ============================================================================
# This snippet routes ONLY paths that have been EXPLICITLY CUT OVER from
# Java to Python via a T6.x cutover spec. It is NOT a complete listing of
# every Python smartbi_compat router.
#
# Phase 2C/IIa Python ports exist in backend/python/smartbi_compat/api/ for
# additional paths that are NOT in this snippet on purpose:
#   - /smart-bi/dashboard, /dashboard/executive   (Tier 2 PILOT, pre-cutover)
#   - /smart-bi/drill-down                         (Phase 2A port, pre-cutover)
#   - /smart-bi/analysis/{production,quality}     for manufacturing factories
#                                                  (Phase 2D placeholder)
#   - /api/mobile/smartbi-config/thresholds*      (Tier 1 PILOT, pre-cutover)
#
# Those routes remain Java-authoritative via the catch-all /api/mobile/ block
# in each vhost — that is intended state until their cutover specs dispatch.
#
# DO NOT add new location blocks here unless a cutover spec authorizes the
# Java→Python switch. Adding a block here moves live customer traffic.
#
# Server live path: /www/server/nginx/conf/snippets/smart-bi-routing.conf
# Repo copy (this file): ops/nginx-vhosts-139/smart-bi-routing.conf — keep in sync.
# ============================================================================

# 1. Phase 2A SmartBI factory analysis (finance/sales/department/region/inventory/procurement)
location ~ ^/api/mobile/(F00[1-46]|DEMO_FACTORY2|DEMO_FACTORY|DEMO_REST|F_CLY_DEMO|F_PPT_DEMO|FOOD_3101_(00[1-9]|0[1-3][0-9]|04[0-8])|MEAT_3101_00[12]|OTHER_3101_001|RES_3101_00[1-9]|RES_GML_001|R001|R_(GML_DEMO|XMX_(CHAIN|FRESH[123]?)|YHDJ_DEMO|YJJ_DEMO)|TEST_0000_001)/smart-bi/analysis/(finance|sales|department|region|inventory|procurement)(/.*)?$ {
    proxy_pass http://cretas_python;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 900s;
    client_max_body_size 500m;
}

