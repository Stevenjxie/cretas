# 项目相关配置
joolun:
  # 名称
  name: RuoYi
  # 版本
  version: 3.8.8
  # 版权年份
  copyrightYear: 2024
  # 文件路径 示例（ Windows配置D:/ruoyi/uploadPath，Linux配置 /home/ruoyi/uploadPath）
  profile: D:/ruoyi/uploadPath
  # 获取ip地址开关
  addressEnabled: false
  # 验证码类型 math 数字计算 char 字符验证
  captchaType: math

# 开发环境配置
server:
  # 服务器的HTTP端口，小程序使用7500
  port: 7500
  servlet:
    # 应用的访问路径
    context-path: /
  tomcat:
    # tomcat的URI编码
    uri-encoding: UTF-8
    # 连接数满后的排队数，默认为100
    accept-count: 1000
    threads:
      # tomcat最大线程数，默认为200
      max: 800
      # Tomcat启动初始化的线程数，默认值10
      min-spare: 100

# 日志配置
logging:
  level:
    com.joolun: debug
    org.springframework: warn

# 用户配置
user:
  password:
    # 密码最大错误次数
    maxRetryCount: 5
    # 密码锁定时间（默认10分钟）
    lockTime: 10

# Spring配置
spring:
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  profiles:
    # MySQL: druid | PostgreSQL: pg
    active: pg
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小
      max-file-size: 10MB
      # 设置总上传的文件大小
      max-request-size: 20MB
  # 服务模块
  devtools:
    restart:
      # 热部署开关
      enabled: true
  data:
    # redis 配置
    redis:
      # 地址
      host: localhost
      # 端口，默认为6379
      port: 6379
      # 数据库索引
      database: 0
      # 密码
      password:
      # 连接超时时间
      timeout: 10s
      lettuce:
        pool:
          # 连接池中的最小空闲连接 (预热连接数)
          min-idle: 10
          # 连接池中的最大空闲连接
          max-idle: 30
          # 连接池的最大数据库连接数 (支持高并发)
          max-active: 100
          # 连接池最大阻塞等待时间
          max-wait: 5000ms
  mvc:
    static-path-pattern: /static/**

# token配置
token:
  # 令牌自定义标识
  header: Authorization
  # 令牌密钥
  secret: abcdefghijklmnopqrstuvwxyz
  # 令牌有效期（默认30分钟）
  expireTime: 30

# MyBatisPlus配置
mybatis-plus:
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  # 自定义TypeHandler
  type-handlers-package: com.joolun.framework.config.typehandler
  #实体扫描，多个package用逗号或者分号分隔
  typeAliasesPackage: com.joolun.**.domain,com.joolun.**.entity
  global-config:
    #是否控制台
    banner: false
    db-config:
      #主键类型
      id-type: auto

# PageHelper分页插件 (pg profile 会覆盖此配置)
pagehelper:
  helperDialect: postgresql
  supportMethodsArguments: true
  params: count=countSql

# Springdoc配置
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
  group-configs:
    - group: 'default'
      display-name: '测试模块'
      paths-to-match: '/**'
      packages-to-scan: com.joolun.web.controller.tool

# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes: /system/notice/*
  # 匹配链接
  urlPatterns: /system/*,/monitor/*,/tool/*

wx:
  # 公众号配置
  mp:
    configs:
      - appId: xxxxxxxx
        secret: '${MALL_WX_MP_SECRET}'
        token: xxxxxxxxxx
        aesKey: '${MALL_WX_MP_AES_KEY}'
  # 小程序配置
  ma:
    configs:
      - appId: wx8a458528c6dfb405
        secret: ${WX_MA_SECRET:请在环境变量WX_MA_SECRET中配置}
        # 微信支付商户号，请去微信支付平台申请
        mchId: 1588227511
        # 微信支付商户APIv2密钥，请去微信支付平台申请
        mchKey: '${MALL_WX_MA_MCH_KEY}'
        # p12证书的位置，绝对路径
        keyPath: /mnt/install/joolun-wx/apiclient_cert.p12
      # 商户小程序
      - appId: wx0b2c60b0e4f36cd6
        secret: 09133bf49bb9ac1550914ab41a0e2c32

mall:
  # 支付、物流回调地址，即后台服务7500端口的外网访问域名，要保证外网能访问，如：https://后台地址/prod-api
  notify-host: http://xx.xxxx.com

# 短信服务配置 (阿里云)
sms:
  # 是否启用短信服务
  enabled: false
  # 每商户每日发送限额
  daily-limit: 100
  aliyun:
    # 阿里云AccessKey (需要在阿里云控制台申请)
    access-key:
    access-secret:
    # 短信签名名称 (需要在阿里云短信服务申请)
    sign-name: 白垩纪食品
    # API端点
    endpoint: dysmsapi.aliyuncs.com

# 阿里云OSS配置 (用于图片存储)
aliyun:
  oss:
    # AccessKey ID (从环境变量读取)
    access-key-id: ${ALIBABA_ACCESSKEY_ID:your-access-key-id}
    # AccessKey Secret (从环境变量读取)
    access-key-secret: ${ALIBABA_SECRET_KEY:your-secret-key}
    # Region ID
    region: cn-shanghai
    # Bucket名称 (需要先在阿里云控制台创建)
    bucket: mall-products-shanghai
    # OSS Endpoint
    endpoint: oss-cn-shanghai.aliyuncs.com
    # STS临时凭证有效期(秒), 默认30分钟
    sts-expire-seconds: 1800

# AI服务配置 (阿里云DashScope - 使用OpenAI兼容模式)
ai:
  deepseek:
    # DashScope API密钥 (与backend-ai-chat服务共用) — 从环境变量注入, 禁止硬编码 (2026-06-25 key轮换+泄露根治)
    api-key: ${DASHSCOPE_API_KEY:}
    # DashScope OpenAI兼容模式接口地址 (代码会自动添加 /v1/chat/completions)
    base-url: https://dashscope.aliyuncs.com/compatible-mode
    # 使用免费额度模型 (was: qwen-turbo-latest)
    model: qwen3.5-27b
    # 限制回复长度以提高响应速度
    max-tokens: 500
    # 超时设置
    timeout: 30