# flows/finance/oa-todo-smoke.yaml
# Finance manager mobile OA smoke test: verify role tab access and todo list load state.
appId: com.cretas.foodtrace
env:
  USERNAME: finance_mgr1
  PASSWORD: "123456"
  HOME_ROOT_ID: main-tab-oa-todo
---
- launchApp:
    clearState: true

- runFlow:
    when:
      visible: "Wait"
    file: ../common/_dismiss_anr.yaml

- runFlow: ../common/_wait_for_app.yaml

- runFlow:
    file: ../common/_login.yaml
    env:
      USERNAME: ${USERNAME}
      PASSWORD: ${PASSWORD}
      HOME_ROOT_ID: ${HOME_ROOT_ID}

- tapOn:
    id: "main-tab-oa-todo"

- extendedWaitUntil:
    visible:
      id: "oa-todo-list"
    timeout: 30000

- assertVisible:
    id: "oa-todo-refresh"

- takeScreenshot: finance-oa-todo-list

- runFlow:
    when:
      visible:
        id: "oa-todo-detail-action"
    commands:
      - tapOn:
          id: "oa-todo-detail-action"
      - extendedWaitUntil:
          visible:
            id: "oa-detail-scroll"
          timeout: 15000
      - takeScreenshot: finance-oa-todo-detail
      - pressKey: back
