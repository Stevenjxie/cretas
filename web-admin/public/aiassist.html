<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f6f2">
  <meta name="color-scheme" content="light">
  <title>白垩纪工厂操作助手</title>
  <style>
    :root {
      --ink: #17201d;
      --muted: #66706c;
      --subtle: #8b9490;
      --paper: #f7f6f2;
      --surface: #fffefa;
      --soft: #eeece6;
      --line: #deddd7;
      --accent: #176b51;
      --accent-strong: #0f5942;
      --accent-soft: #e5f0eb;
      --danger: #a63d3d;
      --danger-soft: #f9ecea;
      --shadow: 0 16px 42px rgb(32 41 37 / 8%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      background: var(--paper);
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--paper);
    }

    body { min-width: 320px; }

    button,
    textarea,
    input { font: inherit; }

    button,
    a { -webkit-tap-highlight-color: transparent; }

    button { cursor: pointer; }

    button:focus-visible,
    a:focus-visible,
    textarea:focus-visible,
    input:focus-visible {
      outline: 3px solid rgb(23 107 81 / 24%);
      outline-offset: 2px;
    }

    .app {
      display: flex;
      flex-direction: column;
      width: min(100%, 860px);
      height: 100dvh;
      min-height: 100dvh;
      margin: 0 auto;
      overflow: hidden;
      background: var(--surface);
      border-inline: 1px solid rgb(23 32 29 / 6%);
    }

    .topbar {
      position: relative;
      z-index: 10;
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 12px;
      min-height: 64px;
      padding: max(10px, env(safe-area-inset-top)) 18px 10px;
      background: rgb(255 254 250 / 92%);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(18px);
    }

    .brand-mark {
      display: grid;
      flex: 0 0 auto;
      place-items: center;
      width: 36px;
      height: 36px;
      color: #fff;
      font-size: 15px;
      font-weight: 760;
      background: var(--accent);
      border-radius: 10px;
      letter-spacing: -.03em;
    }

    .brand-copy {
      flex: 1;
      min-width: 0;
    }

    .brand-copy h1 {
      margin: 0;
      overflow: hidden;
      font-size: 16px;
      font-weight: 720;
      line-height: 1.25;
      text-overflow: ellipsis;
      white-space: nowrap;
      letter-spacing: -.01em;
    }

    .brand-copy p {
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.25;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      background: var(--accent);
      border-radius: 50%;
    }

    .top-actions {
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 6px;
    }

    .icon-button,
    .manual-link {
      display: inline-grid;
      place-items: center;
      min-width: 44px;
      min-height: 44px;
      padding: 0 11px;
      color: var(--ink);
      text-decoration: none;
      background: transparent;
      border: 0;
      border-radius: 10px;
      transition: background-color 160ms ease, color 160ms ease;
    }

    .icon-button:hover,
    .manual-link:hover { background: var(--soft); }

    .manual-link {
      grid-auto-flow: column;
      gap: 6px;
      color: var(--accent-strong);
      font-size: 13px;
      font-weight: 650;
    }

    .icon-button svg,
    .manual-link svg,
    .send-button svg,
    .attach-button svg,
    .copy-button svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .feed {
      flex: 1 1 auto;
      min-height: 0;
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-gutter: stable;
      background:
        radial-gradient(circle at 50% -20%, rgb(23 107 81 / 7%), transparent 42%),
        var(--surface);
    }

    .feed-inner {
      width: min(100%, 720px);
      min-height: 100%;
      margin: 0 auto;
      padding: 24px 22px 28px;
    }

    .welcome {
      display: grid;
      place-items: center;
      min-height: 100%;
      padding: 20px 0 34px;
      text-align: center;
    }

    .welcome-card { width: min(100%, 640px); }

    .welcome-eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 16px;
      padding: 6px 10px;
      color: var(--accent-strong);
      font-size: 12px;
      font-weight: 680;
      background: var(--accent-soft);
      border-radius: 999px;
    }

    .welcome h2 {
      margin: 0;
      font-family: ui-serif, "Songti SC", "Noto Serif CJK SC", serif;
      font-size: clamp(27px, 7vw, 38px);
      font-weight: 680;
      line-height: 1.2;
      letter-spacing: -.035em;
    }

    .welcome-lead {
      max-width: 480px;
      margin: 12px auto 24px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.7;
    }

    .scope-panel {
      display: grid;
      gap: 12px;
      padding: 14px;
      text-align: left;
      background: rgb(255 254 250 / 82%);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: var(--shadow);
    }

    .scope-row {
      display: grid;
      grid-template-columns: 64px 1fr;
      align-items: center;
      gap: 10px;
    }

    .scope-label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 650;
    }

    .segment {
      display: grid;
      grid-auto-columns: 1fr;
      grid-auto-flow: column;
      gap: 4px;
      padding: 3px;
      background: var(--soft);
      border-radius: 11px;
    }

    .segment button {
      min-height: 40px;
      padding: 7px 8px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 620;
      background: transparent;
      border: 0;
      border-radius: 8px;
      transition: background-color 160ms ease, color 160ms ease, box-shadow 160ms ease;
    }

    .segment button[aria-pressed="true"] {
      color: var(--ink);
      background: var(--surface);
      box-shadow: 0 1px 4px rgb(23 32 29 / 10%);
    }

    .suggestions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
      margin-top: 13px;
    }

    .suggestion {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      min-height: 54px;
      padding: 11px 12px;
      color: var(--ink);
      text-align: left;
      background: rgb(255 254 250 / 78%);
      border: 1px solid var(--line);
      border-radius: 13px;
      transition: border-color 160ms ease, background-color 160ms ease, transform 160ms ease;
    }

    .suggestion:hover {
      background: var(--accent-soft);
      border-color: rgb(23 107 81 / 35%);
    }

    .suggestion:active { transform: scale(.985); }

    .suggestion-index {
      display: grid;
      flex: 0 0 auto;
      place-items: center;
      width: 24px;
      height: 24px;
      color: var(--accent-strong);
      font-size: 11px;
      font-weight: 720;
      background: var(--accent-soft);
      border-radius: 7px;
    }

    .suggestion span:last-child {
      font-size: 13px;
      font-weight: 580;
      line-height: 1.45;
    }

    .welcome-note {
      margin: 14px 0 0;
      color: var(--subtle);
      font-size: 12px;
      line-height: 1.55;
    }

    .message-list { padding: 2px 0 10px; }

    .message-row {
      display: flex;
      width: 100%;
      margin: 8px 0 20px;
    }

    .message-row.user { justify-content: flex-end; }

    .user-message {
      max-width: min(82%, 520px);
      padding: 10px 13px;
      color: #1d2522;
      background: var(--soft);
      border-radius: 16px 16px 5px 16px;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .user-message p {
      margin: 0;
      font-size: 15px;
      line-height: 1.55;
    }

    .user-attachment {
      display: block;
      width: min(210px, 100%);
      max-height: 240px;
      margin-top: 9px;
      object-fit: cover;
      border-radius: 10px;
    }

    .message-row.assistant { display: block; }

    .assistant-message {
      position: relative;
      width: 100%;
      min-width: 0;
      padding-left: 34px;
    }

    .assistant-mark {
      position: absolute;
      top: 0;
      left: 0;
      display: grid;
      place-items: center;
      width: 24px;
      height: 24px;
      color: #fff;
      font-size: 10px;
      font-weight: 760;
      background: var(--accent);
      border-radius: 7px;
    }

    .assistant-status {
      display: flex;
      align-items: center;
      gap: 7px;
      min-height: 24px;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 620;
    }

    .stop-button {
      min-height: 34px;
      margin-left: auto;
      padding: 5px 9px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 620;
      background: transparent;
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    .stop-button:hover { color: var(--ink); background: var(--soft); }

    .thinking-dots { display: inline-flex; gap: 3px; }

    .thinking-dots i {
      width: 4px;
      height: 4px;
      background: currentColor;
      border-radius: 50%;
      animation: dot 1.2s ease-in-out infinite;
    }

    .thinking-dots i:nth-child(2) { animation-delay: 120ms; }
    .thinking-dots i:nth-child(3) { animation-delay: 240ms; }

    .markdown-body {
      color: var(--ink);
      font-size: 15px;
      line-height: 1.78;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .markdown-body > :first-child { margin-top: 0; }
    .markdown-body > :last-child { margin-bottom: 0; }

    .markdown-body p { margin: 0 0 13px; }

    .markdown-body h2,
    .markdown-body h3,
    .markdown-body h4 {
      margin: 24px 0 9px;
      color: #111815;
      font-weight: 720;
      line-height: 1.4;
      letter-spacing: -.015em;
    }

    .markdown-body h2 { font-size: 19px; }
    .markdown-body h3 { font-size: 17px; }
    .markdown-body h4 { font-size: 15px; }

    .markdown-body ul,
    .markdown-body ol {
      padding-left: 1.45em;
      margin: 8px 0 15px;
    }

    .markdown-body li { margin: 5px 0; padding-left: .15em; }

    .markdown-body strong { font-weight: 720; }

    .markdown-body code {
      padding: 2px 5px;
      color: #2d4039;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: .88em;
      background: var(--soft);
      border-radius: 5px;
    }

    .markdown-body pre {
      position: relative;
      max-width: 100%;
      padding: 14px;
      overflow-x: auto;
      color: #e8f1ed;
      background: #1c2924;
      border-radius: 10px;
    }

    .markdown-body pre code { padding: 0; color: inherit; background: transparent; }

    .markdown-body a { color: var(--accent-strong); text-underline-offset: 3px; }

    .table-wrap {
      max-width: 100%;
      margin: 14px 0;
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: 10px;
    }

    .markdown-body table {
      width: 100%;
      min-width: 420px;
      border-collapse: collapse;
      font-size: 13px;
    }

    .markdown-body th,
    .markdown-body td {
      padding: 9px 10px;
      text-align: left;
      vertical-align: top;
      border-bottom: 1px solid var(--line);
    }

    .markdown-body th { background: var(--soft); }
    .markdown-body tr:last-child td { border-bottom: 0; }

    .answer-actions {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-top: 14px;
    }

    .copy-button,
    .retry-button {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 40px;
      padding: 7px 10px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 620;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 9px;
    }

    .copy-button:hover { color: var(--ink); background: var(--soft); }
    .copy-button svg { width: 16px; height: 16px; }

    .sources {
      margin-top: 8px;
      color: var(--subtle);
      font-size: 12px;
    }

    .sources summary {
      min-height: 36px;
      padding: 8px 0;
      cursor: pointer;
    }

    .sources-list {
      display: grid;
      gap: 5px;
      margin-top: 3px;
      padding-left: 15px;
    }

    .related {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 12px;
    }

    .related button {
      min-height: 40px;
      padding: 7px 10px;
      color: var(--accent-strong);
      font-size: 12px;
      text-align: left;
      background: var(--accent-soft);
      border: 0;
      border-radius: 9px;
    }

    .error-panel {
      padding: 13px 14px;
      color: #73302f;
      background: var(--danger-soft);
      border: 1px solid rgb(166 61 61 / 20%);
      border-radius: 11px;
    }

    .error-panel p { margin: 0 0 9px; line-height: 1.55; }

    .retry-button {
      min-height: 38px;
      color: var(--danger);
      background: #fff;
      border-color: rgb(166 61 61 / 24%);
    }

    .composer {
      position: relative;
      z-index: 10;
      flex: 0 0 auto;
      padding: 10px 16px max(10px, env(safe-area-inset-bottom));
      background: linear-gradient(to bottom, rgb(255 254 250 / 70%), var(--surface) 24%);
    }

    .composer-inner {
      width: min(100%, 720px);
      margin: 0 auto;
    }

    .attachment-preview {
      display: none;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
      padding: 8px 10px;
      color: var(--muted);
      font-size: 12px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 11px;
    }

    .attachment-preview.visible { display: flex; }

    .attachment-preview img {
      width: 44px;
      height: 44px;
      object-fit: cover;
      border-radius: 8px;
    }

    .attachment-preview span {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .remove-attachment {
      min-width: 40px;
      min-height: 40px;
      color: var(--muted);
      background: transparent;
      border: 0;
      border-radius: 8px;
    }

    .composer-box {
      display: flex;
      align-items: flex-end;
      gap: 7px;
      padding: 7px;
      background: var(--surface);
      border: 1px solid #d6d5cf;
      border-radius: 17px;
      box-shadow: 0 10px 26px rgb(32 41 37 / 8%);
      transition: border-color 160ms ease, box-shadow 160ms ease;
    }

    .composer-box:focus-within {
      border-color: rgb(23 107 81 / 55%);
      box-shadow: 0 10px 28px rgb(32 41 37 / 9%), 0 0 0 3px rgb(23 107 81 / 9%);
    }

    .attach-button,
    .send-button {
      display: grid;
      flex: 0 0 auto;
      place-items: center;
      width: 44px;
      height: 44px;
      min-height: 44px;
      padding: 0;
      border: 0;
      border-radius: 12px;
    }

    .attach-button { color: var(--muted); background: transparent; }
    .attach-button:hover { color: var(--ink); background: var(--soft); }

    .composer textarea {
      flex: 1;
      min-width: 0;
      min-height: 44px;
      max-height: 136px;
      padding: 10px 4px 8px;
      resize: none;
      color: var(--ink);
      background: transparent;
      border: 0;
      outline: 0;
      overflow-y: auto;
      line-height: 1.5;
    }

    .composer textarea::placeholder { color: #9a9e9b; }

    .send-button {
      color: #fff;
      background: var(--accent);
      transition: background-color 160ms ease, opacity 160ms ease, transform 160ms ease;
    }

    .send-button:not(:disabled):hover { background: var(--accent-strong); }
    .send-button:not(:disabled):active { transform: scale(.96); }

    .send-button:disabled {
      color: #9ea5a1;
      cursor: not-allowed;
      background: var(--soft);
    }

    .composer-hint {
      margin: 7px 4px 0;
      color: var(--subtle);
      font-size: 11px;
      text-align: center;
    }

    .toast {
      position: fixed;
      z-index: 50;
      right: 50%;
      bottom: calc(94px + env(safe-area-inset-bottom));
      max-width: calc(100vw - 32px);
      padding: 9px 13px;
      color: #fff;
      font-size: 13px;
      font-weight: 620;
      background: #17201d;
      border-radius: 10px;
      box-shadow: var(--shadow);
      transform: translateX(50%);
      animation: toast-in 180ms ease-out;
    }

    .hidden { display: none !important; }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @keyframes dot {
      0%, 80%, 100% { opacity: .3; transform: translateY(0); }
      40% { opacity: 1; transform: translateY(-2px); }
    }

    @keyframes toast-in {
      from { opacity: 0; transform: translate(50%, 6px); }
      to { opacity: 1; transform: translate(50%, 0); }
    }

    @media (max-width: 560px) {
      .app { border: 0; }
      .topbar { min-height: 60px; padding-inline: 12px; }
      .brand-mark { width: 34px; height: 34px; }
      .brand-copy h1 { font-size: 15px; }
      .brand-copy p { font-size: 11px; }
      .manual-link span { display: none; }
      .top-actions { gap: 0; }
      .feed-inner { padding: 18px 16px 22px; }
      .welcome { padding-block: 10px 22px; }
      .welcome-lead { margin-bottom: 18px; }
      .scope-panel { padding: 11px; }
      .scope-row { grid-template-columns: 1fr; gap: 6px; }
      .suggestions { grid-template-columns: 1fr; }
      .suggestion { min-height: 50px; }
      .assistant-message { padding-left: 30px; }
      .composer { padding-inline: 10px; }
      .composer-hint { display: none; }
    }

    @media (max-width: 350px) {
      .brand-copy p { display: none; }
      .segment button { padding-inline: 4px; font-size: 12px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand-mark" aria-hidden="true">白</div>
      <div class="brand-copy">
        <h1>工厂操作助手</h1>
        <p><span class="status-dot" aria-hidden="true"></span>解释 SOP 与系统逻辑，不执行业务操作</p>
      </div>
      <nav class="top-actions" aria-label="对话操作">
        <a class="manual-link" href="/lsmsop/" target="_blank" rel="noopener" aria-label="打开生产全链路 SOP">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4.5A2.5 2.5 0 0 1 6.5 2H20v18H6.5A2.5 2.5 0 0 0 4 22.5z"/><path d="M4 4.5v18M8 6h8M8 10h8"/></svg>
          <span>完整 SOP</span>
        </a>
        <button class="icon-button" id="new-chat" type="button" aria-label="开始新对话" title="开始新对话">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4z"/></svg>
        </button>
      </nav>
    </header>

    <section class="feed" id="feed" aria-label="对话内容">
      <div class="feed-inner">
        <section class="welcome" id="welcome" aria-labelledby="welcome-title">
          <div class="welcome-card">
            <div class="welcome-eyebrow"><span class="status-dot" aria-hidden="true"></span>最新 F006 生产全链路口径</div>
            <h2 id="welcome-title">今天要处理哪一步？</h2>
            <p class="welcome-lead">告诉我你卡住的页面、字段或业务状态。我会按当前 SOP 给出操作路径、填写内容、验收结果和阻塞条件。</p>

            <div class="scope-panel" aria-label="回答范围">
              <div class="scope-row">
                <span class="scope-label">测试深度</span>
                <div class="segment" id="depth-segment" role="group" aria-label="测试深度">
                  <button type="button" data-value="mvp" aria-pressed="true">MVP</button>
                  <button type="button" data-value="medium" aria-pressed="false">中度</button>
                  <button type="button" data-value="full" aria-pressed="false">全量</button>
                </div>
              </div>
              <div class="scope-row">
                <span class="scope-label">业务线</span>
                <div class="segment" id="line-segment" role="group" aria-label="业务线">
                  <button type="button" data-value="general" aria-pressed="true">通用</button>
                  <button type="button" data-value="stock" aria-pressed="false">存货生产</button>
                  <button type="button" data-value="sales" aria-pressed="false">销售订单</button>
                </div>
              </div>
            </div>

            <div class="suggestions" aria-label="推荐问题">
              <button class="suggestion" type="button" data-question="从零开始创建黄油鸡，MVP 最小闭环先做哪些步骤？"><span class="suggestion-index">01</span><span>从零开始创建黄油鸡，MVP 先做什么？</span></button>
              <button class="suggestion" type="button" data-question="成品 1盒=800克，为什么 Workflow 里不再填写 1kg 产多少盒？"><span class="suggestion-index">02</span><span>SKU、BOM 与 Workflow 的单位怎么分工？</span></button>
              <button class="suggestion" type="button" data-question="生产计划选择成品时出现多个 Workflow，系统应该怎么匹配？"><span class="suggestion-index">03</span><span>选成品时多个 Workflow 冲突怎么处理？</span></button>
              <button class="suggestion" type="button" data-question="报工完成后成品为什么还没进主仓？请按节点帮我排查。"><span class="suggestion-index">04</span><span>报工后成品还没进主仓，先查哪里？</span></button>
            </div>
            <p class="welcome-note">也可以上传当前页面截图。助手会读取截图文字后结合操作手册回答，不会替你提交或修改业务数据。</p>
          </div>
        </section>
        <div class="message-list hidden" id="message-list" aria-live="polite" aria-relevant="additions"></div>
      </div>
    </section>

    <form class="composer" id="composer">
      <div class="composer-inner">
        <div class="attachment-preview" id="attachment-preview">
          <img id="attachment-image" alt="待发送的页面截图">
          <span id="attachment-name"></span>
          <button class="remove-attachment" id="remove-attachment" type="button" aria-label="移除截图">移除</button>
        </div>
        <div class="composer-box">
          <label class="attach-button" for="attachment-input" aria-label="上传页面截图" title="上传页面截图">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21.4 11.6-8.9 8.9a6 6 0 0 1-8.5-8.5l9.6-9.6a4 4 0 1 1 5.7 5.7l-9.8 9.8a2 2 0 1 1-2.8-2.8l8.8-8.8"/></svg>
          </label>
          <input class="sr-only" id="attachment-input" type="file" accept="image/*">
          <label class="sr-only" for="question">输入工厂操作问题</label>
          <textarea id="question" rows="1" maxlength="800" placeholder="描述页面、字段或当前状态…" autocomplete="off"></textarea>
          <button class="send-button" id="send" type="submit" disabled aria-label="发送问题">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22 2 11 13"/><path d="m22 2-7 20-4-9-9-4z"/></svg>
          </button>
        </div>
        <p class="composer-hint">Enter 发送 · Shift+Enter 换行 · 手机端使用右侧发送按钮</p>
      </div>
    </form>
    <div class="toast hidden" id="toast" role="status" aria-live="polite"></div>
  </main>

  <script>
    (function () {
      'use strict';

      var CHAT_ENDPOINT = '/api/food-kb/manual-chat';
      var RELATED_ENDPOINT = '/api/food-kb/manual-chat/related';
      var MAX_HISTORY_MESSAGES = 10;
      var STORAGE_KEY = 'cretas_factory_ai_session_v2';

      var $ = function (id) { return document.getElementById(id); };
      var feed = $('feed');
      var welcome = $('welcome');
      var messageList = $('message-list');
      var composer = $('composer');
      var questionInput = $('question');
      var sendButton = $('send');
      var attachmentInput = $('attachment-input');
      var attachmentPreview = $('attachment-preview');
      var attachmentImage = $('attachment-image');
      var attachmentName = $('attachment-name');
      var toast = $('toast');

      var state = {
        depth: 'mvp',
        businessLine: 'general',
        messages: [],
        imageData: null,
        imageName: '',
        sending: false,
        composing: false,
        stickToBottom: true,
        controller: null
      };

      var toastTimer;

      function escapeHtml(value) {
        return String(value == null ? '' : value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function renderInline(value) {
        var safe = escapeHtml(value);
        safe = safe.replace(/`([^`]+)`/g, '<code>$1</code>');
        safe = safe.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
        safe = safe.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+|\/[^\s)]+)\)/g, function (_, label, href) {
          return '<a href="' + href + '" target="_blank" rel="noopener">' + label + '</a>';
        });
        return safe;
      }

      function renderMarkdown(markdown) {
        var lines = String(markdown || '').replace(/\r\n/g, '\n').split('\n');
        var html = [];
        var paragraph = [];
        var listType = null;
        var inCode = false;
        var codeLines = [];

        function flushParagraph() {
          if (!paragraph.length) return;
          html.push('<p>' + paragraph.map(renderInline).join('<br>') + '</p>');
          paragraph = [];
        }

        function closeList() {
          if (!listType) return;
          html.push('</' + listType + '>');
          listType = null;
        }

        function openList(type) {
          if (listType === type) return;
          closeList();
          html.push('<' + type + '>');
          listType = type;
        }

        for (var i = 0; i < lines.length; i += 1) {
          var line = lines[i];

          if (/^```/.test(line.trim())) {
            flushParagraph();
            closeList();
            if (inCode) {
              html.push('<pre><code>' + escapeHtml(codeLines.join('\n')) + '</code></pre>');
              codeLines = [];
              inCode = false;
            } else {
              inCode = true;
            }
            continue;
          }

          if (inCode) {
            codeLines.push(line);
            continue;
          }

          if (/^\|.+\|\s*$/.test(line) && i + 1 < lines.length && /^\|[\s:|-]+\|\s*$/.test(lines[i + 1])) {
            flushParagraph();
            closeList();
            var tableLines = [line];
            i += 2;
            while (i < lines.length && /^\|.+\|\s*$/.test(lines[i])) {
              tableLines.push(lines[i]);
              i += 1;
            }
            i -= 1;
            var table = '<div class="table-wrap"><table>';
            tableLines.forEach(function (row, rowIndex) {
              var cells = row.split('|').slice(1, -1).map(function (cell) { return cell.trim(); });
              var tag = rowIndex === 0 ? 'th' : 'td';
              table += '<tr>' + cells.map(function (cell) { return '<' + tag + '>' + renderInline(cell) + '</' + tag + '>'; }).join('') + '</tr>';
            });
            table += '</table></div>';
            html.push(table);
            continue;
          }

          var heading = line.match(/^(#{2,4})\s+(.+)$/);
          if (heading) {
            flushParagraph();
            closeList();
            var level = heading[1].length;
            html.push('<h' + level + '>' + renderInline(heading[2]) + '</h' + level + '>');
            continue;
          }

          var unordered = line.match(/^\s*[-*]\s+(.+)$/);
          if (unordered) {
            flushParagraph();
            openList('ul');
            html.push('<li>' + renderInline(unordered[1]) + '</li>');
            continue;
          }

          var ordered = line.match(/^\s*\d+[.)]\s+(.+)$/);
          if (ordered) {
            flushParagraph();
            openList('ol');
            html.push('<li>' + renderInline(ordered[1]) + '</li>');
            continue;
          }

          if (!line.trim()) {
            flushParagraph();
            closeList();
            continue;
          }

          closeList();
          paragraph.push(line);
        }

        if (inCode) html.push('<pre><code>' + escapeHtml(codeLines.join('\n')) + '</code></pre>');
        flushParagraph();
        closeList();
        return html.join('');
      }

      function isNearBottom() {
        return feed.scrollHeight - feed.scrollTop - feed.clientHeight < 120;
      }

      function scrollToBottom(force) {
        if (!force && !state.stickToBottom) return;
        requestAnimationFrame(function () {
          feed.scrollTo({
            top: feed.scrollHeight,
            behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'
          });
        });
      }

      function showToast(message) {
        window.clearTimeout(toastTimer);
        toast.textContent = message;
        toast.classList.remove('hidden');
        toastTimer = window.setTimeout(function () {
          toast.classList.add('hidden');
        }, 2200);
      }

      function copyText(text) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          return navigator.clipboard.writeText(text);
        }
        var helper = document.createElement('textarea');
        helper.value = text;
        helper.style.position = 'fixed';
        helper.style.left = '-9999px';
        document.body.appendChild(helper);
        helper.select();
        var succeeded = document.execCommand('copy');
        document.body.removeChild(helper);
        return succeeded ? Promise.resolve() : Promise.reject(new Error('copy failed'));
      }

      function setConversationVisible() {
        welcome.classList.add('hidden');
        messageList.classList.remove('hidden');
      }

      function updateComposer() {
        questionInput.style.height = 'auto';
        questionInput.style.height = Math.min(questionInput.scrollHeight, 136) + 'px';
        sendButton.disabled = state.sending || (!questionInput.value.trim() && !state.imageData);
        questionInput.disabled = state.sending;
        attachmentInput.disabled = state.sending;
      }

      function persistSession() {
        try {
          sessionStorage.setItem(STORAGE_KEY, JSON.stringify({
            depth: state.depth,
            businessLine: state.businessLine,
            messages: state.messages.slice(-20)
          }));
        } catch (_) { /* session persistence is optional */ }
      }

      function createMessageRecord(role, content) {
        return { role: role, content: content, createdAt: Date.now() };
      }

      function appendUserMessage(content, imageData) {
        setConversationVisible();
        var row = document.createElement('article');
        row.className = 'message-row user';
        var bubble = document.createElement('div');
        bubble.className = 'user-message';
        var text = document.createElement('p');
        text.textContent = content;
        bubble.appendChild(text);
        if (imageData) {
          var image = document.createElement('img');
          image.className = 'user-attachment';
          image.src = imageData;
          image.alt = '用户上传的页面截图';
          bubble.appendChild(image);
        }
        row.appendChild(bubble);
        messageList.appendChild(row);
        scrollToBottom(true);
      }

      function createAssistantPlaceholder() {
        setConversationVisible();
        var row = document.createElement('article');
        row.className = 'message-row assistant';
        var shell = document.createElement('div');
        shell.className = 'assistant-message';
        shell.innerHTML = '<span class="assistant-mark" aria-hidden="true">白</span>'
          + '<div class="assistant-status" role="status"><span>正在检索手册并组织回答</span>'
          + '<span class="thinking-dots" aria-hidden="true"><i></i><i></i><i></i></span>'
          + '<button class="stop-button" type="button">停止</button></div>'
          + '<div class="markdown-body"></div>';
        shell.querySelector('.stop-button').addEventListener('click', function () {
          if (state.controller) state.controller.abort();
        });
        row.appendChild(shell);
        messageList.appendChild(row);
        scrollToBottom(true);
        return { row: row, shell: shell };
      }

      function appendSourceDetails(shell, sources) {
        if (!Array.isArray(sources) || !sources.length) return;
        var details = document.createElement('details');
        details.className = 'sources';
        var summary = document.createElement('summary');
        summary.textContent = '查看参考章节（' + sources.length + '）';
        details.appendChild(summary);
        var list = document.createElement('div');
        list.className = 'sources-list';
        sources.forEach(function (source) {
          var item = document.createElement('span');
          item.textContent = source.title || '操作手册章节';
          list.appendChild(item);
        });
        details.appendChild(list);
        shell.appendChild(details);
      }

      function finishAssistant(placeholder, answer, sources) {
        var status = placeholder.shell.querySelector('.assistant-status');
        status.textContent = '已依据操作手册整理';
        var body = placeholder.shell.querySelector('.markdown-body');
        body.innerHTML = renderMarkdown(answer);
        body.addEventListener('contextmenu', function (event) {
          event.preventDefault();
          copyText(answer).then(function () { showToast('答案已复制'); }).catch(function () { showToast('复制失败'); });
        });

        var actions = document.createElement('div');
        actions.className = 'answer-actions';
        var copy = document.createElement('button');
        copy.type = 'button';
        copy.className = 'copy-button';
        copy.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg><span>复制答案</span>';
        copy.addEventListener('click', function () {
          copyText(answer).then(function () { showToast('答案已复制'); }).catch(function () { showToast('复制失败'); });
        });
        actions.appendChild(copy);
        placeholder.shell.appendChild(actions);
        appendSourceDetails(placeholder.shell, sources);
        scrollToBottom(false);
      }

      function showAssistantError(placeholder, question, message) {
        placeholder.shell.querySelector('.assistant-status').textContent = '回答未完成';
        var body = placeholder.shell.querySelector('.markdown-body');
        body.className = 'error-panel';
        body.innerHTML = '';
        var text = document.createElement('p');
        text.textContent = message;
        var retry = document.createElement('button');
        retry.type = 'button';
        retry.className = 'retry-button';
        retry.textContent = '重试这条问题';
        retry.addEventListener('click', function () { sendQuestion(question, true); });
        body.appendChild(text);
        body.appendChild(retry);
        scrollToBottom(false);
      }

      function renderRelated(shell, questions) {
        if (!Array.isArray(questions) || !questions.length) return;
        var wrap = document.createElement('div');
        wrap.className = 'related';
        questions.slice(0, 3).forEach(function (question) {
          if (typeof question !== 'string' || !question.trim()) return;
          var button = document.createElement('button');
          button.type = 'button';
          button.textContent = question.trim();
          button.addEventListener('click', function () { sendQuestion(question.trim()); });
          wrap.appendChild(button);
        });
        if (wrap.children.length) shell.appendChild(wrap);
      }

      function loadRelated(shell, question, answer) {
        fetch(RELATED_ENDPOINT, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question: question, answer: answer })
        }).then(function (response) {
          if (!response.ok) return null;
          return response.json();
        }).then(function (payload) {
          if (payload && Array.isArray(payload.related_questions)) {
            renderRelated(shell, payload.related_questions);
          }
        }).catch(function () { /* follow-ups are optional */ });
      }

      function historyPayload() {
        return state.messages.slice(-MAX_HISTORY_MESSAGES).map(function (message) {
          return { role: message.role, content: message.content };
        });
      }

      function clearAttachment() {
        state.imageData = null;
        state.imageName = '';
        attachmentInput.value = '';
        attachmentImage.removeAttribute('src');
        attachmentName.textContent = '';
        attachmentPreview.classList.remove('visible');
        updateComposer();
      }

      function setSending(value) {
        state.sending = value;
        updateComposer();
      }

      function sendQuestion(rawQuestion, fromRetry) {
        if (state.sending) return;
        var question = String(rawQuestion == null ? questionInput.value : rawQuestion).trim();
        if (!question && !state.imageData) return;
        if (!question) question = '请根据截图说明当前页面的功能、下一步操作和需要注意的阻塞条件。';

        var priorHistory = historyPayload();
        var imageData = fromRetry ? null : state.imageData;
        if (!fromRetry) {
          appendUserMessage(question, imageData);
          state.messages.push(createMessageRecord('user', question));
          persistSession();
        }

        questionInput.value = '';
        clearAttachment();
        setSending(true);

        var placeholder = createAssistantPlaceholder();
        var controller = new AbortController();
        state.controller = controller;
        var timeout = window.setTimeout(function () { controller.abort(); }, 45000);

        fetch(CHAT_ENDPOINT, {
          method: 'POST',
          signal: controller.signal,
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            question: question,
            category: 'factory',
            depth: state.depth,
            business_line: state.businessLine,
            history: priorHistory,
            image_base64: imageData
          })
        }).then(function (response) {
          return response.text().then(function (text) {
            var payload = {};
            try { payload = text ? JSON.parse(text) : {}; } catch (_) { payload = {}; }
            if (!response.ok || payload.success === false) {
              var serverMessage = typeof payload.message === 'string' && payload.message.length <= 240
                ? payload.message
                : '';
              throw new Error(serverMessage || ('请求失败（HTTP ' + response.status + '）'));
            }
            return payload;
          });
        }).then(function (payload) {
          var answer = typeof payload.answer === 'string' && payload.answer.trim()
            ? payload.answer.trim()
            : '知识库没有返回可显示的答案，请换一种方式描述当前页面或问题。';
          finishAssistant(placeholder, answer, payload.sources || []);
          state.messages.push(createMessageRecord('assistant', answer));
          persistSession();
          loadRelated(placeholder.shell, question, answer);
        }).catch(function (error) {
          var message = error && error.name === 'AbortError'
            ? '请求已超时或被中止。请检查网络后重试；如果问题很长，可以先只问当前一步。'
            : (error && error.message) || '网络请求失败，请稍后重试。';
          showAssistantError(placeholder, question, message);
        }).then(function () {
          window.clearTimeout(timeout);
          if (state.controller === controller) state.controller = null;
          setSending(false);
          questionInput.focus();
        });
      }

      function resizeAndEnable() { updateComposer(); }

      function handleAttachment(file) {
        if (!file) return;
        if (!/^image\//.test(file.type)) {
          showToast('请选择图片文件');
          return;
        }
        if (file.size > 12 * 1024 * 1024) {
          showToast('图片请小于 12 MB');
          return;
        }
        var reader = new FileReader();
        reader.onload = function (event) {
          var dataUrl = event.target && event.target.result;
          if (typeof dataUrl !== 'string') return;
          var image = new Image();
          image.onload = function () {
            var maxWidth = 1280;
            var width = image.width;
            var height = image.height;
            if (width > maxWidth) {
              height = Math.round(height * maxWidth / width);
              width = maxWidth;
            }
            var canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            var context = canvas.getContext('2d');
            context.fillStyle = '#ffffff';
            context.fillRect(0, 0, width, height);
            context.drawImage(image, 0, 0, width, height);
            state.imageData = canvas.toDataURL('image/jpeg', .84);
            state.imageName = file.name;
            attachmentImage.src = state.imageData;
            attachmentName.textContent = file.name + ' · 已压缩用于识别';
            attachmentPreview.classList.add('visible');
            updateComposer();
          };
          image.onerror = function () { showToast('无法读取这张图片'); };
          image.src = dataUrl;
        };
        reader.onerror = function () { showToast('读取图片失败'); };
        reader.readAsDataURL(file);
      }

      function setSegment(group, value) {
        Array.prototype.forEach.call(group.querySelectorAll('button'), function (button) {
          button.setAttribute('aria-pressed', button.dataset.value === value ? 'true' : 'false');
        });
      }

      function startNewConversation() {
        if (state.controller) state.controller.abort();
        state.controller = null;
        state.messages = [];
        state.sending = false;
        messageList.innerHTML = '';
        messageList.classList.add('hidden');
        welcome.classList.remove('hidden');
        clearAttachment();
        questionInput.value = '';
        updateComposer();
        try { sessionStorage.removeItem(STORAGE_KEY); } catch (_) { /* optional */ }
        feed.scrollTop = 0;
        questionInput.focus();
        showToast('已开始新对话');
      }

      function restoreSession() {
        try {
          var saved = JSON.parse(sessionStorage.getItem(STORAGE_KEY) || 'null');
          if (!saved || !Array.isArray(saved.messages)) return;
          if (['mvp', 'medium', 'full'].indexOf(saved.depth) >= 0) state.depth = saved.depth;
          if (['general', 'stock', 'sales'].indexOf(saved.businessLine) >= 0) state.businessLine = saved.businessLine;
          setSegment($('depth-segment'), state.depth);
          setSegment($('line-segment'), state.businessLine);
          saved.messages.slice(-20).forEach(function (message) {
            if (!message || typeof message.content !== 'string') return;
            if (message.role === 'user') {
              appendUserMessage(message.content, null);
            } else if (message.role === 'assistant') {
              var placeholder = createAssistantPlaceholder();
              finishAssistant(placeholder, message.content, []);
            }
            state.messages.push(createMessageRecord(message.role, message.content));
          });
          if (state.messages.length) scrollToBottom(true);
        } catch (_) {
          try { sessionStorage.removeItem(STORAGE_KEY); } catch (_) { /* optional */ }
        }
      }

      $('depth-segment').addEventListener('click', function (event) {
        var button = event.target.closest('button[data-value]');
        if (!button) return;
        state.depth = button.dataset.value;
        setSegment($('depth-segment'), state.depth);
        persistSession();
      });

      $('line-segment').addEventListener('click', function (event) {
        var button = event.target.closest('button[data-value]');
        if (!button) return;
        state.businessLine = button.dataset.value;
        setSegment($('line-segment'), state.businessLine);
        persistSession();
      });

      Array.prototype.forEach.call(document.querySelectorAll('.suggestion'), function (button) {
        button.addEventListener('click', function () { sendQuestion(button.dataset.question || ''); });
      });

      feed.addEventListener('scroll', function () { state.stickToBottom = isNearBottom(); }, { passive: true });
      questionInput.addEventListener('input', resizeAndEnable);
      questionInput.addEventListener('compositionstart', function () { state.composing = true; });
      questionInput.addEventListener('compositionend', function () { state.composing = false; updateComposer(); });
      questionInput.addEventListener('keydown', function (event) {
        if (state.composing || event.isComposing || event.key !== 'Enter' || event.shiftKey) return;
        var coarsePointer = window.matchMedia('(pointer: coarse)').matches;
        if (coarsePointer && !event.ctrlKey && !event.metaKey) return;
        event.preventDefault();
        sendQuestion();
      });

      composer.addEventListener('submit', function (event) {
        event.preventDefault();
        sendQuestion();
      });

      attachmentInput.addEventListener('change', function () {
        handleAttachment(attachmentInput.files && attachmentInput.files[0]);
      });
      $('remove-attachment').addEventListener('click', clearAttachment);
      $('new-chat').addEventListener('click', startNewConversation);

      restoreSession();
      updateComposer();
    }());
  </script>
</body>
