  materialized: []
  owner_action: cost_margin
  notes: >
    菜品毛利。materialized=[] 是真实缺口 — 模板目录里没有 margin/毛利 专属模板
    (dish_sales_top_n/dish_slow_movers/dish_category_breakdown 等都不是毛利口径)。

