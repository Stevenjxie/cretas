  python_ops: RESTAURANT_OPS_RECIPE_COST
  materialized: []
  owner_action: cost_margin
  notes: 食材/菜品成本卡查询 (BOM 用量成本), 与 DISH_MARGIN 相邻但不同口径(成本 vs 毛利率)。

