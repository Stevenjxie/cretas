# 统一业务概念注册表 — 餐饮域 (A0)
#
# 目的: 登记同一个业务概念在四套互不知晓的词汇表里的对应码, 让"这个概念还活着吗/
# 该路由到哪" 从人工 grep 变成一张可 diff、可 CI 校验的表。
#
# 来源 spec: docs/superpowers/specs/2026-07-08-business-concept-registry-direction.md
#            (§3 推荐路径 A0 — 半天登记 ~15 个高频概念 + pytest 校验器)
#
# 字段说明:
#   java_intent  : ai_intent_configs.intent_code (Flyway seed, backend/java/.../db/flyway/*.sql)
#                  仅格式校验 (UPPER_SNAKE_CASE), 不做存在性校验 —
#                  grep Flyway SQL 从 Python 测试里做既脆又贵, 跨语言收益低 (spec §3 A0 备注)。
#   python_ops   : smartbi.gold.restaurant_ops_router.SAMPLE_QUERIES 的 key (RESTAURANT_OPS_* 前缀)。
#                  null = 该概念目前没有 Python ops 直读实现。
#                  CI 校验器同时反向检查: SAMPLE_QUERIES 里的每个码都必须在本文件出现
#                  (这是 A0 真正的价值 — 防止新码上线漏登记, 重演 2026-07-07 Stage-8
#                  LLM 直选 Java 码丢窗口/盈亏的路由抢跑事故)。
#   materialized : 物化模板 code 列表 (backend/python/smartbi/services/materialized_analytics/
#                  templates/*.py 的 @register 类 code 属性)。[] = 无对应模板。
#   owner_action : web-admin restaurantOwnerActionRegistry.ts 的 13 个 scenario 之一。
#                  null = 该概念不直接对应一个老板行动场景 (纯分析类概念)。
#   notes        : 人工判断依据 / 已知歧义 / 缺口说明。

REVENUE_TREND:
  java_intent: RESTAURANT_REVENUE_TREND
  python_ops: RESTAURANT_OPS_TREND_ANALYSIS
  materialized: [monthly_trend, period_comparison_trend]
  owner_action: revenue_growth
  notes: >
    spec §2 方案 A 原始示例概念。Java 执行前经 Phase2 委托 gate;
    窗口/盈亏槽位归 Python (2026-07-07 事故根因: 两者语义同物互不知晓)。

OPS_OVERVIEW:
  java_intent: RESTAURANT_OPS_SALES_SUMMARY  # V20260630_01 直接把 Python 码字符串当 Java intent_code 登记(耦合无登记, spec §1 已实证代价)
  python_ops: RESTAURANT_OPS_SALES_SUMMARY
  materialized: [business_overview_summary]
  owner_action: null
  notes: >
    总体经营概览(营收/客单/订单数/门店差距, 见 restaurant_ops_router.py
    SAMPLE_QUERIES["RESTAURANT_OPS_SALES_SUMMARY"])。java_intent 与 python_ops
    字符串相同 — 这正是 spec §1 描述的"补丁级映射"实例, 不是本文件新造的巧合。
    owner_action 留空: 该概念覆盖面太宽, 具体动作场景视 query 细节落在
    revenue_growth/cost_margin 等多个 scenario, 不是单一映射。

STORE_MARGIN:
