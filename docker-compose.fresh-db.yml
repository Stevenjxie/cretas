services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: cretas_user
      POSTGRES_PASSWORD: cretas_local_only
      POSTGRES_DB: cretas_db
    ports:
      - "127.0.0.1:${FRESH_DB_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cretas_user -d cretas_db"]
      interval: 2s
      timeout: 5s
      retries: 30
    # The gate must always exercise a genuinely empty database. The dedicated
    # Compose project is removed before each run; tmpfs also prevents accidental
    # reuse of local PostgreSQL data after the container is recreated.
    tmpfs:
      - /var/lib/postgresql/data
