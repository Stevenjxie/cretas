name: Secret regression gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tracked-secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Scanner unit tests
        run: python -m unittest scripts/security/test_scan_tracked_secrets.py
      - name: Scan tracked tree
        run: python scripts/security/scan_tracked_secrets.py --root .
