name: E2E Post-Deploy Full Suite

# 部署后全量测试: 手动触发 或 每晚 UTC 18:00 (CST 02:00) 自动运行.
#
# 预期时长: ~35-45 分钟 (含所有 @pr-gate + @post-deploy spec).
# 参考: tests/v1-e2e/scripts/run-full.sh (本地指挥官)

on:
  workflow_dispatch:

concurrency:
  group: e2e-post-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-post-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: cretas_user
          POSTGRES_PASSWORD: cretas_pass
          POSTGRES_DB: cretas_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_PASSWORD: cretas_pass
      POSTGRES_SMARTBI_PASSWORD: smartbi_pass
      JWT_SECRET: ci_e2e_jwt_secret_at_least_32_chars_long_for_github_actions
      SPRING_PROFILES_ACTIVE: pg
      PG_HOST: localhost
      PG_PORT: 5432
      PG_USER: cretas_user
      PG_DB: cretas_db
      PGPASSWORD: cretas_pass
      BACKEND_URL: http://localhost:10010
      WEB_URL: http://localhost:5173

    steps:
      - uses: actions/checkout@v4

      # ── DB setup: create smartbi_db + smartbi_user + pgvector ext on both DBs ──
      - name: Bootstrap smartbi_db + user + pgvector ext on cretas_db & smartbi_db
        run: |
          psql -h localhost -U cretas_user -d cretas_db -c "CREATE USER smartbi_user WITH PASSWORD 'smartbi_pass';"
          psql -h localhost -U cretas_user -d cretas_db -c "CREATE DATABASE smartbi_db OWNER smartbi_user;"
          psql -h localhost -U cretas_user -d cretas_db -c "GRANT ALL PRIVILEGES ON DATABASE smartbi_db TO smartbi_user;"
          # pgvector ext IS pre-installed in pgvector/pgvector:pg17 image (see services.postgres.image above)
          # but each DB still needs explicit `CREATE EXTENSION vector` (extension is per-database).
          # cretas_db: Java backend Flyway migrations create vector(N) columns → need ext.
          # smartbi_db: Python smartbi schemas (food_kb embeddings etc.) need ext.
          psql -h localhost -U cretas_user -d cretas_db   -c "CREATE EXTENSION IF NOT EXISTS vector;"
          psql -h localhost -U cretas_user -d smartbi_db  -c "CREATE EXTENSION IF NOT EXISTS vector;"

      # ── Toolchain ────────────────────────────────────────────────────────────
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
          cache-dependency-path: backend/java/**/pom.xml

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ── Dependencies (parallel-friendly caching) ─────────────────────────────
      - name: Install web-admin deps
        working-directory: web-admin
        run: npm ci --no-audit --no-fund --legacy-peer-deps

      - name: Install v1-e2e deps
        working-directory: tests/v1-e2e
        run: npm ci --no-audit --no-fund --legacy-peer-deps

      - name: Install playwright browsers (chromium only)
        working-directory: tests/v1-e2e
        run: npx playwright install --with-deps chromium

      # ── Backend startup ──────────────────────────────────────────────────────
      # See e2e-pr.yml: spring-boot:run cannot use -am (it would run the goal on
      # the library modules, which have no main class), so the two library
      # modules go into the runner's ephemeral ~/.m2 first.
      - name: Install backend library modules
        working-directory: backend/java
        # 排除式而不是列举式: 列举法在加了 cretas-model / cretas-platform 之后忘了同步,
        # spring-boot:run 直接报 Could not find artifact。排除两个可部署应用, 其余库模块
        # 全装, 以后再加模块不用改这里。
        run: mvn -B -q install -pl '!cretas-api,!cretas-logistics-app' -DskipTests

      - name: Start Java backend (background)
        working-directory: backend/java/cretas-api
        run: |
          nohup mvn spring-boot:run \
            -Dspring-boot.run.jvmArguments="-DDB_PASSWORD=${DB_PASSWORD} -DPOSTGRES_SMARTBI_PASSWORD=${POSTGRES_SMARTBI_PASSWORD} -DJWT_SECRET=${JWT_SECRET}" \
            -Dspring-boot.run.profiles=pg \
            > /tmp/backend.log 2>&1 &
          echo "backend_pid=$!" >> $GITHUB_ENV

      - name: Wait for backend health (up to 4 min)
        run: bash tests/v1-e2e/scripts/wait-for-health.sh http://localhost:10010/api/mobile/health 240

      # ── Web-admin startup ────────────────────────────────────────────────────
      - name: Start Vite dev server (background)
        working-directory: web-admin
        run: |
          nohup npm run dev > /tmp/web-admin.log 2>&1 &
          echo "web_pid=$!" >> $GITHUB_ENV

      - name: Wait for web-admin port (up to 2 min)
        run: bash tests/v1-e2e/scripts/wait-for-port.sh localhost 5173 120

      # ── Run full post-deploy suite ───────────────────────────────────────────
      - name: Run full test suite (all @pr-gate + @post-deploy specs)
        run: bash tests/v1-e2e/scripts/run-full.sh

      # ── Artifacts ────────────────────────────────────────────────────────────
      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/v1-e2e/playwright-report/
          retention-days: 3

      - name: Upload Playwright traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: tests/v1-e2e/test-results/
          retention-days: 3
          if-no-files-found: ignore

      - name: Upload backend log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-log
          path: /tmp/backend.log
          retention-days: 3
          if-no-files-found: ignore

      - name: Upload web-admin log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-admin-log
          path: /tmp/web-admin.log
          retention-days: 3
          if-no-files-found: ignore
