name: KB Drift Check

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'docs/plans/restaurant-product-manual.html'
      - 'docs/plans/factory-operation-manual.html'
      - 'scripts/ci/check-kb-meta-freshness.py'
      - 'scripts/ci/check-kb-anchor-consistency.py'
      - 'scripts/ci/check-manual-chat-contract.py'
      - 'backend/python/food_kb/api/manual_chat.py'
  # Scheduled runs are intentionally paused while the referenced manual
  # sections await a real content review. Related PRs and manual dispatches
  # still enforce the drift contract without producing a weekly known-red run.

jobs:
  kb-drift-check:
    if: github.event_name != 'pull_request' || startsWith(github.head_ref, 'daily/integration-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check meta freshness (restaurant §1/§2/§11 + factory §0A/§0B/§6/§7/§10)
        run: python scripts/ci/check-kb-meta-freshness.py
      - name: Check synthesis anchor consistency (both manuals)
        run: python scripts/ci/check-kb-anchor-consistency.py
      - name: Check manual_chat.py contract integrity
        run: python scripts/ci/check-manual-chat-contract.py
