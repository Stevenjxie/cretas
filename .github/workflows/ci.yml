name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_prod:
        description: 'Deploy to production (10010/8083)?'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---- Java Backend: Build + Test ----
  java-build-test:
    runs-on: ubuntu-latest

    # PostgreSQL service container — enables PG-required IT classes (e.g.
    # FactoryConfigServiceImplReorderIT) to run against real PostgreSQL
    # instead of being skipped due to H2 fallback failing on PG-specific
    # types (BLOB / JSONB / vector). Image matches e2e-pr.yml for consistency
    # (pgvector pre-installed for any future entity that uses vector(N)).
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: cretas_user
          POSTGRES_PASSWORD: cretas_pass
          POSTGRES_DB: cretas_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
          cache-dependency-path: backend/java/cretas-api/pom.xml

      # Bootstrap IT database matching application-r10-it.properties:
      # cretas_r10_it_test owned by cretas_user. Schema is auto-applied
      # by Spring Boot via spring.sql.init.schema-locations=r10-it-schema.sql
      # at @DataJpaTest startup, so we only need to provision the empty DB.
      # pgvector ext is enabled defensively — TrainingSample.embedding_blob
      # is BLOB (not vector), but other entities scanned via @EntityScan
      # may declare vector columns and Hibernate can't validate without ext.
      - name: Bootstrap cretas_r10_it_test DB + pgvector ext
        env:
          PGPASSWORD: cretas_pass
        run: |
          psql -h localhost -U cretas_user -d cretas_db -c "CREATE DATABASE cretas_r10_it_test OWNER cretas_user;"
          psql -h localhost -U cretas_user -d cretas_db             -c "CREATE EXTENSION IF NOT EXISTS vector;"
          psql -h localhost -U cretas_user -d cretas_r10_it_test    -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Maven compile and test
        working-directory: backend/java/cretas-api
        run: mvn -B clean verify -Dspring.profiles.active=test -pl .
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-test-results
          path: backend/java/cretas-api/target/surefire-reports/
          retention-days: 14

  # ---- Python Service: Lint + Test ----
  python-lint-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: backend/python/requirements.txt
      - name: Install dependencies
        # NOTE: legacy-resolver fallback chain handles resolution-too-deep failures.
        # Recent CI runs (2026-05-09) show step exits 0 cleanly — continue-on-error removed.
        run: |
          pip install --upgrade pip
          pip install --use-deprecated=legacy-resolver -r requirements.txt || pip install -r requirements.txt
          pip install flake8 pytest pytest-asyncio pytest-cov pytest-timeout
      - name: Flake8 lint (enforced)
        # 2026-05-09: continue-on-error removed after debt cleanup PR. Sub-1
        # (PR #233) cleared 563 zero-risk auto-fixable; this PR cleared the
        # remaining ~933 (E501/E402/E128/F841/F821/F811/F601/etc.) via
        # autopep8 + targeted noqa with provenance comments. Followups can
        # gradually replace each # noqa with a proper rewrite.
        # grpc_stubs/ excluded — auto-generated protobuf code (per PR #217 §1).
        run: flake8 --max-line-length=120 --statistics --count --exclude=venv,__pycache__,.git,grpc_stubs .
      - name: Phase 2B endpoint coverage gate
        # Runs pytest collection-only with the semantic endpoint gate enabled.
        # Verifies every endpoint in conftest.KNOWN_ENDPOINTS (34 canonical)
        # has >=3 tests carrying @pytest.mark.api_endpoint markers. The gate
        # raises pytest.exit(returncode=1) on a miss; this is its own step
        # (rather than env on "Run pytest") because that step ends in
        # `|| true`, which would silently swallow the gate's exit code.
        env:
          CRETAS_TEST_ENDPOINT_GATE: "1"
        run: pytest --collect-only -q tests/
      - name: Run pytest
        run: |
          pytest tests/ -v --timeout=30 \
            --ignore=tests/test_data_accuracy.py \
            -k "not e2e and not integration" \
            --tb=short || true

  # ---- Vue Web Admin: Build + Type Check ----
  vue-build-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web-admin/package-lock.json
      - run: npm ci --legacy-peer-deps
      - name: Build
        run: npm run build
      - name: Type check
        run: npx vue-tsc -b
        continue-on-error: true
      - name: Vitest unit tests
        # CI cleanup PR-2 (May 9 2026): pre-existing failures are now green
        # (118/118 tests pass locally as of 2026-05-09). Empty-suite file
        # useSmartBIShortcuts.test.ts converted to real describe/it block.
        # continue-on-error removed — vitest now enforced.
        run: npm test

  # ---- React Native: Jest Tests ----
  rn-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/CretasFoodTrace
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
          cache-dependency-path: frontend/CretasFoodTrace/yarn.lock
      - run: yarn install --frozen-lockfile
      - name: Run tests
        # CI cleanup PR-2 (May 9 2026): jest + jest-expo added to devDeps,
        # 44/44 suites + 880 tests pass locally. continue-on-error removed.
        # 3 integration/screens/* tests deferred via jest.config.js
        # testPathIgnorePatterns (pre-existing @react-navigation ESM transform debt
        # — separate follow-up to fix transformIgnorePatterns).
        run: yarn test --ci --coverage --forceExit
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rn-coverage
          path: frontend/CretasFoodTrace/coverage/
          retention-days: 14

  # ---- Deploy to Test Environment (staging) ----
  # Requires GitHub secret: DEPLOY_SSH_KEY (private key for root@47.100.235.168)
  deploy-staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [java-build-test, python-lint-test]
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
          cache-dependency-path: backend/java/cretas-api/pom.xml
      - name: Build JAR
        working-directory: backend/java/cretas-api
        run: mvn -B clean package -DskipTests
      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
      - name: Add server to known_hosts
        run: ssh-keyscan -H 47.100.235.168 >> ~/.ssh/known_hosts
      - name: Deploy to test env (10011/8084)
        run: |
          rsync -az backend/java/cretas-api/target/cretas-backend-system-1.0.0.jar \
            root@47.100.235.168:/www/wwwroot/cretas/aims-0.0.1-SNAPSHOT.jar.staging
          rsync -az --exclude='__pycache__' --exclude='*.pyc' --exclude='.env' --exclude='venv*' \
            backend/python/ root@47.100.235.168:/www/wwwroot/cretas/code/backend/python/
          ssh root@47.100.235.168 "cd /www/wwwroot/cretas && bash restart.sh test"
      - name: Health check
        run: |
          sleep 15
          curl -sf --retry 5 --retry-delay 5 http://47.100.235.168:10011/api/mobile/health || echo "::warning::Java test health check failed"
          curl -sf --retry 5 --retry-delay 5 http://47.100.235.168:8084/health || echo "::warning::Python test health check failed"

  # ---- Deploy to Production (manual only) ----
  # Requires: workflow_dispatch with deploy_prod=true
  deploy-prod:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_prod == 'true'
    needs: [deploy-staging]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
          cache-dependency-path: backend/java/cretas-api/pom.xml
      - name: Build JAR
        working-directory: backend/java/cretas-api
        run: mvn -B clean package -DskipTests
      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
      - name: Add server to known_hosts
        run: ssh-keyscan -H 47.100.235.168 >> ~/.ssh/known_hosts
      - name: Backup + deploy to prod (10010/8083)
        run: |
          ssh root@47.100.235.168 "cd /www/wwwroot/cretas && cp aims-0.0.1-SNAPSHOT.jar aims-0.0.1-SNAPSHOT.jar.bak.\$(date +%Y%m%d%H%M)"
          rsync -az backend/java/cretas-api/target/cretas-backend-system-1.0.0.jar \
            root@47.100.235.168:/www/wwwroot/cretas/aims-0.0.1-SNAPSHOT.jar
          rsync -az --exclude='__pycache__' --exclude='*.pyc' --exclude='.env' --exclude='venv*' \
            backend/python/ root@47.100.235.168:/www/wwwroot/cretas/code/backend/python/
          ssh root@47.100.235.168 "systemctl restart cretas-backend && systemctl restart cretas-python"
      - name: Health check
        run: |
          sleep 15
          curl -sf --retry 5 --retry-delay 5 http://47.100.235.168:10010/api/mobile/health || { echo "::error::Prod Java health check FAILED"; exit 1; }
          curl -sf --retry 5 --retry-delay 5 http://47.100.235.168:8083/health || { echo "::error::Prod Python health check FAILED"; exit 1; }
