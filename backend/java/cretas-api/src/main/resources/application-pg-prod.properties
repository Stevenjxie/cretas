# ===================================
# PostgreSQL 生产环境配置
# 使用方式: --spring.profiles.active=pg-prod
# ===================================

# 应用配置
spring.application.name=Cretas Backend System
server.port=10010

# 优雅关闭 (收到 SIGTERM 后等待请求完成，最多30秒)
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# ==========================================
# PostgreSQL 数据库配置 (生产环境)
# ==========================================
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:cretas_db}?currentSchema=public&stringtype=unspecified&ssl=${DB_SSL:false}
spring.datasource.username=${DB_USERNAME:cretas_user}
spring.datasource.password=${DB_PASSWORD}

# HikariCP 连接池配置 (生产环境优化)
spring.datasource.hikari.pool-name=CretasPostgresPool
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.connection-test-query=SELECT 1
# 禁用 autoCommit 以配合 Hibernate 事务管理
spring.datasource.hikari.auto-commit=false
# BUG-03-01: abort sessions that hold an open transaction idle > 30 s.
# Guards against postSupplierDeliveryToInventory leaving a POSTING row locked
# when the HTTP connection drops between saveAndFlush(POSTING) and save(POSTED).
spring.datasource.hikari.connection-init-sql=SET idle_in_transaction_session_timeout=30000

# ==========================================
# JPA/Hibernate PostgreSQL 配置 (生产环境)
# ==========================================
spring.jpa.database=POSTGRESQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# 生产环境: 禁用验证 (PostgreSQL BYTEA/BLOB 类型映射差异导致验证失败)
# 数据已迁移完成，表结构正确，跳过 Hibernate schema validation
spring.jpa.hibernate.ddl-auto=none

# ==========================================
# Flyway 自动 migration 配置 (2026-04-16 加入)
# ==========================================
# 背景: 今天一天撞了 4 次"entity 字段加了但 DB 列没迁"事故 (V20260416_01-04).
# 之前 262 个 migration 文件全靠手工 psql -f 应用, 没有对账.
# 从今往后: Spring Boot 启动时 Flyway 自动按序应用 classpath:db/migration/*.sql.
#
# baseline 策略: 历史 262 个 migration + 今天的 V20260416_01..04 都已手动
# 应用到 prod+test DB. 设 baseline-version=20260416.99 让 Flyway 在首次
# 运行时把 flyway_schema_history 基线标记到这个虚拟版本, 跳过所有 <=
# 20260416.99 的历史文件. 未来新 migration 必须用 V20260417_01+ 或更晚
# 日期, 会被自动应用.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/flyway
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=20260415.98
spring.flyway.baseline-description=Baseline before Flyway adoption (262 legacy + 4 V20260416_* manually applied; V20260415_99 + V20260416_00 bootstrap completeness CREATE TABLE IF NOT EXISTS so no-op on prod)
spring.flyway.validate-on-migrate=false
spring.flyway.out-of-order=false
# Phase 2A test factory user password hash: hardcoded DISABLED on prod renders login un-loginable.
spring.flyway.placeholders.PHASE2A_TEST_USER_PASSWORD_HASH=DISABLED
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.defer-datasource-initialization=false

# PostgreSQL 生产环境性能优化
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.generate_statistics=false
spring.jpa.properties.hibernate.cache.use_second_level_cache=false

# 慢查询日志（>500ms）
spring.jpa.properties.hibernate.session.events.log.LOG_QUERIES_SLOWER_THAN_MS=500
logging.level.org.hibernate.SQL_SLOW=INFO
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=true

# SQL初始化 - 生产环境禁用
spring.sql.init.mode=never

# ==========================================
# Actuator / Prometheus 监控 (生产环境)
# ==========================================
# 独立管理端口，不对外暴露
management.server.port=10012
management.endpoints.web.exposure.include=health,prometheus,metrics
management.endpoint.prometheus.enabled=true
management.metrics.tags.application=cretas-backend

# ==========================================
# 日志配置 (生产环境精简)
# ==========================================
logging.level.root=WARN
logging.level.com.cretas.aims=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql=WARN

# ==========================================
# 文件上传配置
# ==========================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB
# 防 OOM: 文件 > 1MB 溢写磁盘, 不常驻 Java heap (60MB CSV 上传曾打爆 -Xmx1280m)
spring.servlet.multipart.file-size-threshold=1MB
spring.servlet.multipart.location=/tmp/cretas-upload
# T-R5-2 (R5 audit §1 B2): force UTF-8 request-body decoding. Multipart
# filenames are recovered by NormalizedFilenameMultipartFile (controller-side).
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# ==========================================
# Jackson 配置
# ==========================================
spring.jackson.time-zone=GMT+8
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.fail-on-empty-beans=false
# AUD-3: Force BigDecimal deserialization for JSON floats. Audit a4597f9cf
# verified LOW RISK (0 silent corruption sites, all controllers use safe
# .toString() or Number-cast patterns). Closes 28-digit precision overflow
# attack on Pricing >100% discount validator (Map<String,Object> Jackson
# default deserializes JSON floats as Double, rounding 99.99...99 to 100.0
# BEFORE PricingStrategyController's scale check fires).
spring.jackson.deserialization.use-big-decimal-for-floats=true

# ==========================================
# JWT配置 (生产环境必须使用环境变量)
# ==========================================
cretas.jwt.secret=${JWT_SECRET}
cretas.jwt.expiration=86400000
cretas.jwt.refresh-expiration=2592000000

# Cookie 认证配置
# secure=false because web-admin runs on HTTP (139.196.165.140:8086)
# Change to true when HTTPS is enabled
cretas.cookie.secure=false
cretas.cookie.same-site=Lax

# ==========================================
# A5 集团联销 (cross-factory sales) feature flag
# ==========================================
# PR #309 A5=C (2026-05-10): 默认 false → 销售订单仅匹配 SO.factoryId 所在工厂的成品。
# 设为 true 启用"集团池"语义 (跳过 factoryId 过滤, 允许跨工厂匹配 / 预留)。
# 详见 docs/architecture/2026-05-10-feature-flag-cross-factory-sales.md
cretas.sales.cross-factory.enabled=${CROSS_FACTORY_SALES_ENABLED:false}

# ==========================================
# AI服务配置 (生产环境)
# ==========================================
cretas.ai.service.url=http://localhost:8083
cretas.ai.service.timeout=120000
cretas.ai.service.connect-timeout=10000

# AI意图自动学习配置
cretas.ai.intent.auto-learn.enabled=true
cretas.ai.intent.auto-learn.confidence-threshold=0.9
cretas.ai.intent.auto-learn.max-keywords-per-intent=50

# ==========================================
# AI 语义路由器配置
# ==========================================
cretas.ai.semantic-router.enabled=true
cretas.router.threshold.direct-execute=0.92
cretas.router.threshold.reranking=0.75
cretas.router.default-top-n=5

# ==========================================
# Embedding 服务配置 (生产环境启用)
# ==========================================
embedding.mode=grpc
grpc.client.embedding-service.address=static://localhost:9090
grpc.client.embedding-service.negotiationType=plaintext

# ==========================================
# 禁用自动配置
# ==========================================
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration,org.springframework.boot.actuate.autoconfigure.security.servlet.ManagementWebSecurityAutoConfiguration

# ==========================================
# Redis 配置
# ==========================================
spring.data.redis.host=localhost
spring.data.redis.port=6379

# ==========================================
# 讯飞语音识别配置 (生产环境使用环境变量)
# ==========================================
cretas.iflytek.appid=${IFLYTEK_APPID:placeholder}
cretas.iflytek.api-key=${IFLYTEK_API_KEY:placeholder}
cretas.iflytek.api-secret=${IFLYTEK_API_SECRET:placeholder}
cretas.iflytek.iat-url=wss://iat-api.xfyun.cn/v2/iat
cretas.iflytek.language=zh_cn
cretas.iflytek.domain=iat
cretas.iflytek.accent=mandarin
cretas.iflytek.ptt=true

# ==========================================
# 阿里云 OSS 配置
# ==========================================
aliyun.oss.enabled=${ALIYUN_OSS_ENABLED:false}
aliyun.oss.endpoint=oss-cn-shanghai.aliyuncs.com
aliyun.oss.access-key-id=${ALIBABA_ACCESSKEY_ID:placeholder}
aliyun.oss.access-key-secret=${ALIBABA_SECRET_KEY:placeholder}
aliyun.oss.audio-bucket=cretas-audio
aliyun.oss.media-bucket=cretas-media

# ==========================================
# 通知网关 (Sprint 9 P1.2)
# ==========================================
notification.gateway=${NOTIFICATION_GATEWAY:logging}
aliyun.sms.endpoint=dysmsapi.aliyuncs.com
aliyun.sms.access-key-id=${ALIBABA_ACCESSKEY_ID:placeholder}
aliyun.sms.access-key-secret=${ALIBABA_SECRET_KEY:placeholder}
aliyun.sms.sign-name=${ALIYUN_SMS_SIGN_NAME:placeholder}
aliyun.sms.template-code=${ALIYUN_SMS_TEMPLATE_CODE:placeholder}

# ==========================================
# Phase 3 Canvas-Notify SMS gateway (AliyunSmsNotifier)
# 命名空间与 notification.gateway (Sprint 9 P1.2) 隔离, 服务于 Canvas-Notify 体系.
# ==========================================
notify.aliyun-sms.access-key=${ALIYUN_SMS_ACCESS_KEY:}
notify.aliyun-sms.access-secret=${ALIYUN_SMS_ACCESS_SECRET:}
notify.aliyun-sms.sign-name=${ALIYUN_SMS_SIGN_NAME:}
notify.aliyun-sms.endpoint=https://dysmsapi.aliyuncs.com/
notify.aliyun-sms.region=cn-hangzhou

# ==========================================
# Active Learning 配置
# ==========================================
# Wave-10: 启用 Active Learning 调度器 (collectSample 已接入意图匹配流)
cretas.active-learning.scheduler.enabled=true
cretas.ai.active-learning.confidence-threshold=0.7
cretas.ai.active-learning.min-cluster-size=5
cretas.ai.active-learning.transition-smoothing=1.0
cretas.ai.active-learning.promotion-min-effectiveness=0.80
cretas.ai.active-learning.promotion-min-adoptions=3
cretas.ai.active-learning.data-retention-days=90
cretas.ai.active-learning.performance-degradation-threshold=0.05
cretas.ai.keyword.promotion.min-factories=3
cretas.ai.keyword.promotion.min-effectiveness=0.80

# ==========================================
# 多意图识别配置
# ==========================================
ai.multi-intent.threshold=0.55
ai.multi-intent.sigmoid-scale=6.0
ai.multi-intent.max-intents=3
ai.multi-intent.llm-fallback-enabled=true

# ==========================================
# Python SmartBI 服务配置 (生产环境)
# ==========================================
python-smartbi.enabled=true
python-smartbi.url=http://localhost:8083
# P0-4 (Apr 20): 60s → 900s (15min) for 200K+ row uploads. Subagent #332 root cause — Java→Python OkHttp readTimeout was bottleneck for large files.
python-smartbi.timeout=900000
python-smartbi.connect-timeout=10000
python-smartbi.fallback-on-error=false
python-smartbi.health-check-interval=30000
python-smartbi.max-retries=3

# ==========================================
# Python Error Analysis Service (生产环境)
# ==========================================
python-error-analysis.enabled=true
python-error-analysis.url=http://localhost:8083
python-error-analysis.timeout=60000
python-error-analysis.connect-timeout=10000
python-error-analysis.fallback-on-error=false
python-error-analysis.max-retries=3
python-error-analysis.health-check-interval=30000

# ==========================================
# SmartBI PostgreSQL 配置 (生产环境)
# ==========================================
smartbi.postgres.enabled=true
smartbi.postgres.url=jdbc:postgresql://${SMARTBI_DB_HOST:localhost}:${SMARTBI_DB_PORT:5432}/${SMARTBI_DB_NAME:smartbi_db}
smartbi.postgres.username=${SMARTBI_DB_USERNAME:smartbi_user}
smartbi.postgres.password=${SMARTBI_DB_PASSWORD}
smartbi.postgres.driver-class-name=org.postgresql.Driver
smartbi.postgres.hikari.pool-name=SmartBIPostgresPool
smartbi.postgres.hikari.maximum-pool-size=15
smartbi.postgres.hikari.minimum-idle=5
smartbi.postgres.hikari.idle-timeout=600000
smartbi.postgres.hikari.max-lifetime=1800000
smartbi.postgres.hikari.connection-timeout=30000

# SmartBI File Storage (for retry capability)
smartbi.file-storage.path=/www/wwwroot/cretas/uploads/smartbi

# ==========================================
# Python Intent Classifier 配置 (生产环境)
# ==========================================
python-classifier.enabled=true
python-classifier.url=http://localhost:8083
python-classifier.timeout=10000
python-classifier.connect-timeout=3000
python-classifier.health-check-interval=30000
python-classifier.weight=0.6
python-classifier.top-k=5
python-classifier.min-confidence=0.1
python-classifier.high-confidence-threshold=0.70

# v35.0: OOD 检测阈值 (Wave-12: 调整适配 Temperature Scaling T=1.5)
python-classifier.ood.entropy-threshold=3.0
python-classifier.ood.margin-threshold=0.10
python-classifier.ood.max-logit-threshold=3.0

# ==========================================
# 客如云 POS 集成配置 (生产环境)
# ==========================================
cretas.pos.keruyun.app-key=${KERUYUN_APP_KEY:}
cretas.pos.keruyun.app-secret=${KERUYUN_APP_SECRET:}
cretas.pos.keruyun.api-base-url=${KERUYUN_API_BASE_URL:https://open.keruyun.com}
cretas.pos.keruyun.webhook-secret=${KERUYUN_WEBHOOK_SECRET:}
cretas.pos.keruyun.timeout=30000
cretas.pos.keruyun.connect-timeout=10000
