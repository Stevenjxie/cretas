# ===================================
# PostgreSQL 开发环境配置
# 使用方式: --spring.profiles.active=pg
# ===================================

# 应用配置
spring.application.name=Cretas Backend System
server.port=10010

# 优雅关闭
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# ==========================================
# PostgreSQL 数据库配置
# ==========================================
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/cretas_db?currentSchema=public&stringtype=unspecified
spring.datasource.username=cretas_user
spring.datasource.password=${DB_PASSWORD:}

# HikariCP 连接池配置
spring.datasource.hikari.pool-name=CretasPostgresPool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000
# BUG-03-01: abort sessions that hold an open transaction idle > 30 s.
# Guards against postSupplierDeliveryToInventory leaving a POSTING row locked
# when the HTTP connection drops between saveAndFlush(POSTING) and save(POSTED).
spring.datasource.hikari.connection-init-sql=SET idle_in_transaction_session_timeout=30000

# ==========================================
# JPA/Hibernate PostgreSQL 配置
# ==========================================
spring.jpa.database=POSTGRESQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Mirror prod (application-pg-prod.properties:69, application-prod.properties:22).
# When this is true AND spring.sql.init.mode != never, Spring Boot 3.2 wires
# every "database-initializer" bean (flyway, flywayInitializer,
# dataSourceScriptDatabaseInitializer) to depend on every EMF — while
# DatabaseInitializationDependencyConfigurer also wires EMF → flyway —
# producing a circular depends-on at refresh time. data.sql is MySQL-legacy
# (INSERT IGNORE, integer booleans) and silently fails on PG anyway; seed
# data lives in Flyway migrations (db/flyway/V*.sql), not data.sql.
spring.jpa.defer-datasource-initialization=false

# Flyway (same baseline strategy as pg-prod — see application-pg-prod.properties)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/flyway
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=20260415.98
spring.flyway.baseline-description=Baseline before Flyway adoption (allow V20260415_99 + V20260416_00 bootstrap completeness to apply on fresh DBs)
spring.flyway.validate-on-migrate=false
spring.flyway.out-of-order=false
# Phase 2A test factory user password hash (read from env var; fallback to DISABLED makes login fail)
spring.flyway.placeholders.PHASE2A_TEST_USER_PASSWORD_HASH=${PHASE2A_TEST_USER_PASSWORD_HASH:DISABLED}

# PostgreSQL 特有优化
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# SQL 初始化配置 — disabled to mirror prod (application-pg-prod.properties:87,
# application-prod.properties:25). data.sql is MySQL-era legacy and silently
# fails on PG; all seed data lives in Flyway migrations under db/flyway/.
# Leaving this `always` with defer=true triggers the circular
# flyway↔primaryEntityManagerFactory wiring described above.
spring.sql.init.mode=never
spring.sql.init.continue-on-error=true
spring.sql.init.platform=postgresql

# ==========================================
# 日志配置
# ==========================================
logging.level.root=INFO
logging.level.com.cretas.aims=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ==========================================
# 文件上传配置
# ==========================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB
spring.servlet.multipart.file-size-threshold=1MB
spring.servlet.multipart.location=/tmp/cretas-upload
# T-R5-2 (R5 audit §1 B2): force UTF-8 request-body decoding. Multipart
# filenames are recovered by NormalizedFilenameMultipartFile (controller-side).
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# ==========================================
# Jackson 配置
# ==========================================
spring.jackson.time-zone=GMT+8
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.fail-on-empty-beans=false
# AUD-3: Force BigDecimal deserialization for JSON floats. Audit a4597f9cf
# verified LOW RISK (0 silent corruption sites, all controllers use safe
# .toString() or Number-cast patterns). Closes 28-digit precision overflow
# attack on Pricing >100% discount validator (Map<String,Object> Jackson
# default deserializes JSON floats as Double, rounding 99.99...99 to 100.0
# BEFORE PricingStrategyController's scale check fires).
spring.jackson.deserialization.use-big-decimal-for-floats=true

# ==========================================
# JWT配置
# ==========================================
cretas.jwt.secret=${JWT_SECRET:CHANGE_ME_NOT_FOR_PRODUCTION}
cretas.jwt.expiration=86400000
cretas.jwt.refresh-expiration=2592000000

# ==========================================
# AI服务配置
# ==========================================
cretas.ai.service.url=http://localhost:8083
cretas.ai.service.timeout=120000
cretas.ai.service.connect-timeout=10000
cretas.ai.service.fallback-enabled=true

# ==========================================
# 禁用自动配置
# ==========================================
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration,org.springframework.boot.actuate.autoconfigure.security.servlet.ManagementWebSecurityAutoConfiguration

# ==========================================
# 讯飞语音识别配置
# ==========================================
cretas.iflytek.appid=${IFLYTEK_APPID:placeholder}
cretas.iflytek.api-key=${IFLYTEK_API_KEY:placeholder}
cretas.iflytek.api-secret=${IFLYTEK_API_SECRET:placeholder}
cretas.iflytek.iat-url=wss://iat-api.xfyun.cn/v2/iat
cretas.iflytek.language=zh_cn
cretas.iflytek.domain=iat
cretas.iflytek.accent=mandarin
cretas.iflytek.ptt=true

# ==========================================
# 阿里云 OSS 配置
# ==========================================
aliyun.oss.endpoint=oss-cn-shanghai.aliyuncs.com
aliyun.oss.access-key-id=${ALIBABA_ACCESSKEY_ID:your-access-key-id}
aliyun.oss.access-key-secret=${ALIBABA_SECRET_KEY:your-secret-key}
aliyun.oss.audio-bucket=cretas-audio
aliyun.oss.media-bucket=cretas-media

# ==========================================
# 通知网关 (Sprint 9 P1.2)
# notification.gateway: logging | aliyun-sms
#   logging  = 默认; DbNotificationServiceImpl 持久化到 notifications 表 (Sprint 8 P1.1)
#   aliyun-sms = AliyunSmsNotificationServiceImpl 在持久化基础上额外发 SMS
# ==========================================
notification.gateway=${NOTIFICATION_GATEWAY:logging}
aliyun.sms.endpoint=dysmsapi.aliyuncs.com
aliyun.sms.access-key-id=${ALIBABA_ACCESSKEY_ID:placeholder}
aliyun.sms.access-key-secret=${ALIBABA_SECRET_KEY:placeholder}
aliyun.sms.sign-name=${ALIYUN_SMS_SIGN_NAME:placeholder}
aliyun.sms.template-code=${ALIYUN_SMS_TEMPLATE_CODE:placeholder}

# ==========================================
# Phase 3 Canvas-Notify SMS gateway (AliyunSmsNotifier)
# 命名空间与上面 notification.gateway (Sprint 9 P1.2) 隔离, 服务于 Canvas-Notify 体系.
# 配置缺省时 AliyunSmsNotifier.send() 抛 IllegalStateException; 调用方需先 isConfigured() check.
# ==========================================
notify.aliyun-sms.access-key=${ALIYUN_SMS_ACCESS_KEY:}
notify.aliyun-sms.access-secret=${ALIYUN_SMS_ACCESS_SECRET:}
notify.aliyun-sms.sign-name=${ALIYUN_SMS_SIGN_NAME:}
notify.aliyun-sms.endpoint=https://dysmsapi.aliyuncs.com/
notify.aliyun-sms.region=cn-hangzhou

# ==========================================
# Embedding 服务配置
# ==========================================
embedding.mode=noop
grpc.client.embedding-service.address=static://localhost:9090
grpc.client.embedding-service.negotiationType=plaintext

# ==========================================
# Active Learning 配置
# ==========================================
cretas.ai.active-learning.confidence-threshold=0.7
cretas.ai.active-learning.min-cluster-size=5
cretas.ai.active-learning.transition-smoothing=1.0
cretas.ai.active-learning.promotion-min-effectiveness=0.80
cretas.ai.active-learning.promotion-min-adoptions=3
cretas.ai.active-learning.data-retention-days=90
cretas.ai.active-learning.performance-degradation-threshold=0.05
cretas.ai.keyword.promotion.min-factories=3
cretas.ai.keyword.promotion.min-effectiveness=0.80

# ==========================================
# 多意图识别配置
# ==========================================
ai.multi-intent.threshold=0.55
ai.multi-intent.sigmoid-scale=6.0
ai.multi-intent.max-intents=3
ai.multi-intent.llm-fallback-enabled=true

# ==========================================
# Python SmartBI 服务配置
# ==========================================
python-smartbi.enabled=true
python-smartbi.url=http://localhost:8083
python-smartbi.timeout=15000
python-smartbi.connect-timeout=5000
python-smartbi.fallback-on-error=false
python-smartbi.health-check-interval=30000
python-smartbi.max-retries=2

# ==========================================
# Python Error Analysis Service
# ==========================================
python-error-analysis.enabled=true
python-error-analysis.url=http://localhost:8083
python-error-analysis.timeout=30000
python-error-analysis.connect-timeout=5000
python-error-analysis.fallback-on-error=false
python-error-analysis.max-retries=2
python-error-analysis.health-check-interval=30000

# ==========================================
# SmartBI PostgreSQL 动态数据存储
# ==========================================
# 注意: 当使用 pg profile 时，主数据源已是 PostgreSQL
# SmartBI 仍使用独立的数据库/Schema 存储动态数据
smartbi.postgres.enabled=true
smartbi.postgres.url=jdbc:postgresql://localhost:5432/smartbi_db
smartbi.postgres.username=smartbi_user
smartbi.postgres.password=${POSTGRES_SMARTBI_PASSWORD:}
smartbi.postgres.driver-class-name=org.postgresql.Driver
smartbi.postgres.hikari.pool-name=SmartBIPostgresPool
smartbi.postgres.hikari.maximum-pool-size=10
smartbi.postgres.hikari.minimum-idle=2
smartbi.postgres.hikari.idle-timeout=600000
smartbi.postgres.hikari.max-lifetime=1800000
smartbi.postgres.hikari.connection-timeout=30000

# SmartBI File Storage (for retry capability)
smartbi.file-storage.path=uploads/smartbi

# ==========================================
# Python Intent Classifier 配置
# ==========================================
python-classifier.enabled=true
python-classifier.url=http://localhost:8083
python-classifier.timeout=10000
python-classifier.connect-timeout=3000
python-classifier.health-check-interval=30000
python-classifier.weight=0.5
python-classifier.top-k=5
python-classifier.min-confidence=0.1

# ==========================================
# 客如云 POS 集成配置 (开发环境)
# ==========================================
cretas.pos.keruyun.app-key=${KERUYUN_APP_KEY:}
cretas.pos.keruyun.app-secret=${KERUYUN_APP_SECRET:}
cretas.pos.keruyun.api-base-url=${KERUYUN_API_BASE_URL:https://open.keruyun.com}
cretas.pos.keruyun.webhook-secret=${KERUYUN_WEBHOOK_SECRET:}
cretas.pos.keruyun.timeout=30000
cretas.pos.keruyun.connect-timeout=10000

# ==========================================
# 一加物流 — 高德地图 (Amap) 地理编码 + 驾车距离 (Phase 4, 2026-07-11)
# key 从服务器 .env.prod 的 AMAP_API_KEY 环境变量注入, 严禁在此硬编码真实值。
# ==========================================
amap.api.key=${AMAP_API_KEY:}
amap.daily-query-budget=${AMAP_DAILY_QUERY_BUDGET:800}
logistics.depot.lng=${LOGISTICS_DEPOT_LNG:120.476894}
logistics.depot.lat=${LOGISTICS_DEPOT_LAT:31.437014}

# 档1-B (2026-07-11): 驾车路线多提供商 fallback 链 — AMAP → TENCENT → BAIDU 顺序可配;
# 各 provider 由各自 key 是否配置独立门控 (key 为空 = 跳过)。严禁在此硬编码真实 key 值。
logistics.route.providers=${LOGISTICS_ROUTE_PROVIDERS:AMAP,TENCENT,BAIDU}
tencent.map.key=${TENCENT_MAP_KEY:}
tencent.map.daily-query-budget=${TENCENT_MAP_DAILY_QUERY_BUDGET:800}
baidu.map.ak=${BAIDU_MAP_AK:}
baidu.map.daily-query-budget=${BAIDU_MAP_DAILY_QUERY_BUDGET:800}
