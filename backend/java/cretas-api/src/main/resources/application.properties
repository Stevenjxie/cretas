# 应用配置
spring.application.name=Cretas Backend System
server.port=10010

# 数据库配置
# 注意：需要根据实际环境配置数据库连接信息
spring.datasource.url=jdbc:mysql://localhost:3306/cretas_db?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA配置
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

# SQL初始化配置 (data.sql)
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true

# 日志配置
logging.level.root=INFO
logging.level.com.cretas.aims=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ==========================================
# Actuator / Prometheus 监控
# ==========================================
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.prometheus.enabled=true
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,coreReadiness,db,diskSpace
management.endpoint.health.group.readiness.show-details=always
management.endpoint.health.group.ai.include=aiWarmup
management.endpoint.health.group.ai.show-details=always
management.metrics.tags.application=cretas-backend

# 文件上传配置
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB
spring.servlet.multipart.file-size-threshold=1MB
spring.servlet.multipart.location=/tmp/cretas-upload
# T-R5-2 (R5 audit §1 B2): Tomcat defaults multipart filename decoding to
# ISO-8859-1, which mojibakes Chinese filenames (销售数据_2026年5月.xlsx →
# 12× U+FFFD in the upload-history page). Force UTF-8 for request bodies; the
# multipart filename itself is recovered application-side by
# NormalizedFilenameMultipartFile wrapping every upload at the controller.
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# Jackson 配置（JSON序列化）
spring.jackson.time-zone=GMT+8
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.fail-on-empty-beans=false
# AUD-3: Force BigDecimal deserialization for JSON floats. Audit a4597f9cf
# verified LOW RISK (0 silent corruption sites, all controllers use safe
# .toString() or Number-cast patterns). Closes 28-digit precision overflow
# attack on Pricing >100% discount validator (Map<String,Object> Jackson
# default deserializes JSON floats as Double, rounding 99.99...99 to 100.0
# BEFORE PricingStrategyController's scale check fires).
spring.jackson.deserialization.use-big-decimal-for-floats=true

# CORS 配置（已在Controller中配置，这里作为备份）
# spring.web.cors.allowed-origins=*
# spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
# spring.web.cors.allowed-headers=*

# JWT配置
cretas.jwt.secret=${JWT_SECRET:CHANGE_ME_NOT_FOR_PRODUCTION}
cretas.jwt.expiration=86400000
cretas.jwt.refresh-expiration=2592000000

# Cookie 认证配置 (web admin HttpOnly cookies)
# 开发环境: secure=false, sameSite=Lax (HTTP 可用)
# 生产环境: secure=true, sameSite=Strict (仅 HTTPS)
cretas.cookie.secure=false
cretas.cookie.same-site=Lax

# 演示账号 (路演扫码免密登录 + 只读锁). /api/mobile/auth/demo-login?tenant=rest|factory|logistics
# 进入对应 demo 租户; DemoReadOnlyInterceptor 对 factory-ids 拦截写操作. demo 账号仅存在于 prod.
cretas.demo.enabled=${CRETAS_DEMO_ENABLED:true}
# D11B default-off cutover for three audited restaurant read Tools.
cretas.ai.tool-gateway.intent-dispatch-migration.enabled=${CRETAS_AI_TOOL_GATEWAY_INTENT_DISPATCH_MIGRATION_ENABLED:false}
cretas.ai.factory-capability-routing.enabled=${CRETAS_AI_FACTORY_CAPABILITY_ROUTING_ENABLED:false}
# factory demo switched DEMO_FACTORY (F001, restaurant-flavored + empty finance/报工) ->
# DEMO_FACTORY2 (F006 六扇门 manufacturing: 365 报工 + coherent cockpit). env-overridable so a
# future re-point needs no rebuild (CRETAS_DEMO_FACTORY_IDS / _FACTORY_ID / _FACTORY_USERNAME).
# 注意: DEMO_LOGISTICS 故意不加进 cretas.demo.factory-ids 只读锁名单 — 排线调度演示需要
# 在自己租户内创建/调整/确认计划 (写操作), 跨租户隔离靠 JwtAuthInterceptor 的 JWT factoryId 锁定.
#
# 2026-07-28 F_DEMO 治理 (餐饮 AI 飞轮回接 spec §入口收敛, organizer 自做):
# F_DEMO 是 AIPublicDemoController (/api/public/ai-demo) 的免登录公开演示沙盒租户,
# 此前**既不在**本写闸名单**也不是**餐饮租户 —— 三不管。它唯一的写保护是 controller 内
# 的 ALLOWED_SENSITIVITY_LEVELS={"LOW"} 单点判断; 一旦该判断被绕过/放宽, 编排器的
# AI 确认执行写闸 (IntentExecutionOrchestrator.isDemoFactory, 读同一配置源且 fail-closed
# 不随 cretas.demo.enabled 关闭) 对 F_DEMO 完全不生效。加进名单 = 补上这层纵深。
# 对正常演示零影响: 公开演示本就只放行 LOW (只读) 意图。
#
# ⛔ 有意**不**把 F_DEMO 认成餐饮租户, 也**不**映射到 DEMO_REST (spec 给的两个备选):
# 核查 AIPublicDemoController 后确认它是**通用/工厂域**公开演示 —— 指代词表是
# "这批/上一批/刚才那个" 批次溯源语义, 无任何餐饮代码路径, 与专用餐饮演示租户
# DEMO_REST 是两个东西。认成餐饮租户会把工厂演示问句误路由进餐饮语义规划器;
# 映射成 DEMO_REST 会在工厂演示页上答餐饮数据。两者都是错的, 故只做写闸治理。
cretas.demo.factory-ids=${CRETAS_DEMO_FACTORY_IDS:DEMO_REST,DEMO_FACTORY2,F_DEMO}
cretas.demo.rest.factory-id=${CRETAS_DEMO_REST_ID:DEMO_REST}
cretas.demo.rest.username=${CRETAS_DEMO_REST_USERNAME:demo_rest}
cretas.demo.factory.factory-id=${CRETAS_DEMO_FACTORY_ID:DEMO_FACTORY2}
cretas.demo.factory.username=${CRETAS_DEMO_FACTORY_USERNAME:demo_factory2}
cretas.demo.logistics.factory-id=${CRETAS_DEMO_LOGISTICS_ID:DEMO_LOGISTICS}
cretas.demo.logistics.username=${CRETAS_DEMO_LOGISTICS_USERNAME:dispatcher_demo_logistics}

# 转发 / 分享链接 base URL (PR #872 follow-up to #860).
# Public share page rendered at {base}/share/{token}. Override per env via
# CRETAS_SHARE_BASE_URL — prod = https://admin.cretaceousfuture.com.
cretas.share.base-url=${CRETAS_SHARE_BASE_URL:https://admin.cretaceousfuture.com}

# ==========================================
# A5 集团联销 (cross-factory sales) feature flag
# ==========================================
# PR #309 A5=C (2026-05-10): 默认 false → 销售订单仅匹配 SO.factoryId 所在工厂的成品。
# 设为 true 启用"集团池"语义 (跳过 factoryId 过滤, 允许跨工厂匹配 / 预留)。
# 未来 factory_network 表落地后可改为按销售组织受控的子集。
# 详见 docs/architecture/2026-05-10-feature-flag-cross-factory-sales.md
cretas.sales.cross-factory.enabled=false

# App 最低版本 (PR #309 B5)
# /api/mobile/health 返回此值，App 启动时检查；当前版本 < min-version 时提示更新
# 默认 1.0.0 不阻塞任何用户；Steve 后续按需 bump
cretas.app.min-version=${CRETAS_APP_MIN_VERSION:1.0.0}

# 补录时效锁 (C-074/C-075/X-10 六扇门客户硬约束"大前天不允许补")
# 允许补录的最大天数: 2 = T-2(前天), 1 = T-1(昨天), 0 = 仅今天
# 六扇门: "最多到前天, 大前天不允许补" → maxDays=2
cretas.backdate.max-days=2

# AI服务配置
cretas.ai.service.url=http://localhost:8083
cretas.ai.service.timeout=120000
cretas.ai.service.connect-timeout=10000
cretas.ai.service.fallback-enabled=true

# ==========================================
# LLM 意图消歧配置
# ==========================================
# 食品知识 vs 工厂数据冲突时调用 LLM 判断真实意图
cretas.ai.disambiguation.enabled=true
cretas.ai.disambiguation.cache-ttl-seconds=3600
cretas.ai.disambiguation.max-cache-size=500
cretas.ai.disambiguation.timeout-ms=5000

# Redis配置（可选，用于AI响应缓存）
# 禁用Redis自动配置（本地测试）
# 同时禁用Spring Security以便API测试
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration,org.springframework.boot.actuate.autoconfigure.security.servlet.ManagementWebSecurityAutoConfiguration

# 讯飞语音识别配置
# 请在生产环境中使用环境变量或secrets管理
cretas.iflytek.appid=${IFLYTEK_APPID:placeholder}
cretas.iflytek.api-key=${IFLYTEK_API_KEY:placeholder}
cretas.iflytek.api-secret=${IFLYTEK_API_SECRET:placeholder}
cretas.iflytek.iat-url=wss://iat-api.xfyun.cn/v2/iat
cretas.iflytek.language=zh_cn
cretas.iflytek.domain=iat
cretas.iflytek.accent=mandarin
cretas.iflytek.ptt=true

# 阿里云 OSS 配置
aliyun.oss.endpoint=oss-cn-shanghai.aliyuncs.com
aliyun.oss.access-key-id=${ALIBABA_ACCESSKEY_ID:your-access-key-id}
aliyun.oss.access-key-secret=${ALIBABA_SECRET_KEY:your-secret-key}
aliyun.oss.audio-bucket=cretas-audio
aliyun.oss.media-bucket=cretas-media

# ==========================================
# 通知渠道 — 钉钉群机器人 (Phase 3 Canvas-Notify)
# ==========================================
# webhook-url: 完整 URL 含 access_token=xxx (机器人安全设置选"自定义机器人"后获得).
# secret: 加签密钥 (机器人安全设置选"加签"后获得). 留空 → 不签名 (仅 access_token 校验, 不推荐).
# msg-type: text (默认) 或 markdown.
notify.dingtalk.webhook-url=${DINGTALK_WEBHOOK:}
notify.dingtalk.secret=${DINGTALK_SECRET:}
notify.dingtalk.msg-type=${DINGTALK_MSG_TYPE:text}
notify.dingtalk.connect-timeout=${DINGTALK_CONNECT_TIMEOUT_MS:5000}
notify.dingtalk.read-timeout=${DINGTALK_READ_TIMEOUT_MS:10000}

# ==========================================
# Embedding 服务配置
# ==========================================
# 模式选择:
#   grpc - 使用独立的 embedding-service (gRPC 调用)
#   其他值 - 使用 NoOpEmbeddingClient (语义匹配禁用)
#
# 开发环境：使用 NoOp 模式（短语映射准确率更高）
# v12.9: gRPC embedding 模式准确率 78%，短语映射模式准确率 88%
# v15.1: 启用 gRPC 模式，配合新训练数据和预处理器
# 生产环境：使用 gRPC 模式连接独立的 embedding-service
# embedding.mode=grpc

# 开发环境/快速启动：使用 NoOp 模式
embedding.mode=noop
grpc.client.embedding-service.address=static://localhost:9090
grpc.client.embedding-service.negotiationType=plaintext
cretas.embedding.grpc.batch-deadline-seconds=${EMBEDDING_BATCH_DEADLINE_SECONDS:15}

# ==========================================
# Active Learning 配置
# ==========================================
# 低置信度阈值：低于此值的样本将被收集用于主动学习
cretas.ai.active-learning.confidence-threshold=0.7

# 最小聚类大小：只有超过此大小的聚类才会被分析
cretas.ai.active-learning.min-cluster-size=5

# Laplace平滑参数：用于意图转移概率计算
cretas.ai.active-learning.transition-smoothing=1.0

# 跨工厂知识推广配置
cretas.ai.active-learning.promotion-min-effectiveness=0.80
cretas.ai.active-learning.promotion-min-adoptions=3

# 数据保留天数：超过此天数的已处理数据将被清理
cretas.ai.active-learning.data-retention-days=90

# 性能下降检测阈值：超过此比例视为性能下降
cretas.ai.active-learning.performance-degradation-threshold=0.05

# 关键词维护配置（现有配置的补充）
cretas.ai.keyword.promotion.min-factories=3
cretas.ai.keyword.promotion.min-effectiveness=0.80

# ==========================================
# 多意图识别配置
# ==========================================
# 默认置信度阈值
ai.multi-intent.threshold=0.55

# Sigmoid 放大系数
ai.multi-intent.sigmoid-scale=6.0

# 最大返回意图数
ai.multi-intent.max-intents=3

# Phase 0 验证：启用 LLM Fallback（当 embedding 不可用时使用 LLM）
# 设为 true 可以在 embedding 服务禁用时仍然启用多意图检测
ai.multi-intent.llm-fallback-enabled=true

# ==========================================
# Python SmartBI 服务配置
# ==========================================
# SmartBI 所有功能完全由 Python 服务 (端口 8083) 处理
# 包括：Excel 解析、字段映射 (LLM)、数据分析、图表生成、AI 洞察
# 不再有 Java fallback，Python 服务必须可用
python-smartbi.enabled=true

# Python 服务地址
# 本地测试：http://localhost:8083
# 生产环境：http://139.196.165.140:8083
python-smartbi.url=http://localhost:8083

# 请求超时时间（毫秒）
python-smartbi.timeout=15000

# 连接超时时间（毫秒）
python-smartbi.connect-timeout=5000

# 错误时是否降级到 Java 实现
# 已禁用！SmartBI 完全依赖 Python 服务，不再有 Java fallback
# Python 服务不可用时将直接返回错误
python-smartbi.fallback-on-error=false

# 健康检查间隔（毫秒）
python-smartbi.health-check-interval=30000

# ==========================================
# Unified Data Layer v1 — Gold shadow-read flag
# ==========================================
# When true, finance-overview requests also fire an async Gold
# (/api/smartbi/gold/finance-summary) call and log the result for
# offline comparison. Never affects the legacy response.
# Phase B v0 cutover: flip to true on test, collect logs for a few
# days to verify Gold numbers match, then cut over the primary read.
smartbi.gold.shadow-read.enabled=false

# When true, getFinanceOverview tries Gold FIRST and serves a Gold-backed
# DashboardResponse (KPI cards + top_stores populated from agg_*). On any
# failure (Gold down, parse error, empty data) falls back to legacy
# transparently. Primary-read supersedes shadow-read — if both flags are
# on, shadow-read still logs but primary-read's result is what's returned.
smartbi.gold.read-primary.enabled=false

# 最大重试次数
python-smartbi.max-retries=2

# ==========================================
# Python Error Analysis Service
# ==========================================
# 注意: 已合并到统一的 python-services (8083)
# 与 SmartBI 一样，不再有 Java fallback
python-error-analysis.enabled=true
python-error-analysis.url=http://localhost:8083
python-error-analysis.timeout=30000
python-error-analysis.connect-timeout=5000
python-error-analysis.fallback-on-error=false
python-error-analysis.max-retries=2
python-error-analysis.health-check-interval=30000

# ==========================================
# PostgreSQL SmartBI 动态数据存储
# ==========================================
# SmartBI 使用独立的 PostgreSQL 数据库存储动态 Excel 数据
# JSONB + GIN 索引支持高效的动态字段查询

# 是否启用 PostgreSQL 动态数据存储
# 启用后，Excel 解析的动态数据将存储到 PostgreSQL
# 禁用时，仍使用 MySQL 固定表结构存储
smartbi.postgres.enabled=true

# PostgreSQL 连接配置
smartbi.postgres.url=jdbc:postgresql://localhost:5432/smartbi_db
smartbi.postgres.username=smartbi_user
smartbi.postgres.password=${POSTGRES_SMARTBI_PASSWORD:}
smartbi.postgres.driver-class-name=org.postgresql.Driver

# HikariCP 连接池配置
smartbi.postgres.hikari.pool-name=SmartBIPostgresPool
smartbi.postgres.hikari.maximum-pool-size=10
smartbi.postgres.hikari.minimum-idle=2
smartbi.postgres.hikari.idle-timeout=600000
smartbi.postgres.hikari.max-lifetime=1800000
smartbi.postgres.hikari.connection-timeout=30000

# ==========================================
# Python Intent Classifier 配置
# ==========================================
# 基于 chinese-roberta-wwm-ext 的意图分类器
# 训练准确率: 97.45%, F1 Weighted: 97.29%
# 185 个意图类别，直接 softmax 输出

# 是否启用分类器服务
python-classifier.enabled=true

# Python 服务地址（与 SmartBI 共用 python-services）
python-classifier.url=http://localhost:8083

# 请求超时时间（毫秒）
python-classifier.timeout=10000

# 连接超时时间（毫秒）
python-classifier.connect-timeout=3000

# 健康检查间隔（毫秒）
python-classifier.health-check-interval=30000

# 分类器在融合评分中的权重
# 分类器(0.5) > 短语匹配(0.3) > 语义匹配(0.2)
python-classifier.weight=0.5

# 返回的 Top-K 结果数
python-classifier.top-k=5

# 最小置信度阈值
python-classifier.min-confidence=0.1

# ============================================================
# P4 Conversation State Service (Redis-backed)
# ============================================================
# TTL for conversation state per user session (minutes).
# After this idle timeout, Redis keys expire and context is lost.
cretas.conversation.ttl-minutes=30

# Max turns kept per (factoryId, userId, deviceId) — LPUSH + LTRIM caps.
# Oldest turns dropped when the cap is exceeded.
cretas.conversation.max-turns=10

# ==========================================
# Phase 2B Python AI matcher
# ==========================================
# Feature flag: when true, intent matching delegates to Python service
# at /api/ai/intent/match instead of running the Java in-process matcher.
# Default false → no behavior change for existing deployments.
ai.use-python-matcher=${AI_USE_PYTHON_MATCHER:false}

# Phase 2B canary whitelist (#73 §1.4 / #29 §3.1): comma-separated factoryIds
# that should dispatch to the Python matcher when ai.use-python-matcher=true.
# Empty (default) = all factories dispatch (backward compat with the boolean
# flag). Stage 2 canary = single factory (e.g. F999). Stage 3 = multi factory
# (e.g. F999,F001,F123). After full rollout the property is cleared again.
ai.python-matcher-factories=${AI_PYTHON_MATCHER_FACTORIES:}

# Caffeine LRU cache around the Python matcher client (per spec §6.4).
# Cache is keyed by (factoryId|businessType|query|configVersion).
ai.cache.max-size=${AI_CACHE_MAX_SIZE:1000}
ai.cache.ttl-seconds=${AI_CACHE_TTL_S:300}

# Python service base URL (Phase 2B AI matcher endpoint lives here).
# Production: 47.100.235.168:8083 (prod) / :8084 (test).
cretas.python.base-url=${PYTHON_AI_BASE_URL:http://localhost:8083}

# Internal-call shared secret for Java→Python authentication.
# Java sends as X-Internal-Secret header; Python verifies in dependency.
# Empty default — set via INTERNAL_API_SECRET env var on real deploys.
cretas.python.internal-secret=${INTERNAL_API_SECRET:}

# Bounded restaurant agent runtime. OFF is fail-closed and performs zero
# upstream runtime calls. Activation is a separate release decision.
cretas.restaurant-agent-runtime.mode=${RESTAURANT_AGENT_RUNTIME_MODE:OFF}
cretas.restaurant-agent-runtime.emitter-timeout-ms=${RESTAURANT_AGENT_RUNTIME_EMITTER_TIMEOUT_MS:120000}

# ==========================================
# Resilience4j circuit breaker for Python AI matcher client
# ==========================================
# Sliding window of 10 calls (count-based). Open if ≥6/10 fail.
# Wait 5s in OPEN state, then transition to HALF_OPEN, allow 3 trial
# calls, close if all succeed. Auto-transition without manual probe.
resilience4j.circuitbreaker.instances.pythonAiMatcher.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.pythonAiMatcher.slidingWindowSize=10
resilience4j.circuitbreaker.instances.pythonAiMatcher.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.pythonAiMatcher.failureRateThreshold=60
resilience4j.circuitbreaker.instances.pythonAiMatcher.waitDurationInOpenState=5s
resilience4j.circuitbreaker.instances.pythonAiMatcher.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.pythonAiMatcher.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.instances.pythonAiMatcher.recordExceptions[0]=org.springframework.web.client.RestClientException
resilience4j.circuitbreaker.instances.pythonAiMatcher.recordExceptions[1]=java.net.ConnectException
resilience4j.circuitbreaker.instances.pythonAiMatcher.recordExceptions[2]=java.net.SocketTimeoutException
resilience4j.circuitbreaker.instances.pythonAiMatcher.recordExceptions[3]=java.io.IOException

# ==========================================
# Spring Mail / EMAIL Notify channel (Canvas-Notify Phase 3)
# ==========================================
# SMTP config. Empty defaults → EmailSender enters MOCK mode (logs would-be-send
# but NotifyStatus.SENT for test envs without SMTP credentials).
# Production deploy: set MAIL_HOST / MAIL_USERNAME / MAIL_PASSWORD via env.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.protocol=smtp
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=false
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
# From address — defaults to notify@cretas.example (override on real deploys).
cretas.notify.email.from=${MAIL_FROM:notify@cretas.example}
cretas.notify.email.from-name=${MAIL_FROM_NAME:Cretas 通知}

# ==========================================
# Notify - WeChat WorkApp credentials (Phase 3 follow-up)
# ==========================================
# Set via env vars WECHAT_CORP_ID / WECHAT_APP_SECRET / WECHAT_AGENT_ID on real deploys
# (per .claude/rules/CREDENTIAL-MANAGEMENT.md - never commit raw secrets).
# When any of these is empty, WeChatNotifier skips the actual HTTP call and
# WeChatSender writes a FAILED NotifyLog with a clear "credentials missing" error.
# This keeps test envs unaffected while flagging operations gaps in prod.
notify.wechat.corp-id=${WECHAT_CORP_ID:}
notify.wechat.app-secret=${WECHAT_APP_SECRET:}
notify.wechat.agent-id=${WECHAT_AGENT_ID:0}
# Override only for testing - defaults to the public WeChat WorkApp endpoint
notify.wechat.base-url=${WECHAT_BASE_URL:https://qyapi.weixin.qq.com}
notify.wechat.connect-timeout-ms=${WECHAT_CONNECT_TIMEOUT_MS:5000}
notify.wechat.read-timeout-ms=${WECHAT_READ_TIMEOUT_MS:10000}
# AgentOps Runtime Shadow remains fail-closed unless the master flag, explicit tenant/role
# allowlists and deterministic sample threshold all admit the trusted actor. Python repeats this
# exact contract at the internal API boundary.
agent-ops.runtime-shadow.enabled=${AGENT_OPS_RUNTIME_SHADOW_ENABLED:false}
agent-ops.runtime-shadow.factory-allowlist=${AGENT_OPS_RUNTIME_SHADOW_FACTORY_ALLOWLIST:}
agent-ops.runtime-shadow.role-allowlist=${AGENT_OPS_RUNTIME_SHADOW_ROLE_ALLOWLIST:}
agent-ops.runtime-shadow.sample-bps=${AGENT_OPS_RUNTIME_SHADOW_SAMPLE_BPS:0}
agent-ops.runtime-shadow.rollout-salt=${AGENT_OPS_RUNTIME_SHADOW_ROLLOUT_SALT:runtime-shadow-v1}
