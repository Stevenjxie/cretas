# 平台层对每个可部署服务的强制配置。服务通过
#   spring.config.import=classpath:application-platform.properties
# 引入, 不要各自抄一遍。
#
# 为什么必须有这一条:
# 本仓库的鉴权走的是自己的拦截器链(JwtAuthInterceptor / PermissionInterceptor /
# ModuleEnabledInterceptor / RequireRoleInterceptor), 全仓没有任何
# SecurityFilterChain。单体靠在【每一个】profile 里排除 SecurityAutoConfiguration
# 来让 Spring Security 让路 —— 这是个隐式契约, 靠每个服务自己记得。
#
# 加第二个服务时它就断了: cretas-logistics-app 第一次上服务器, 因为没抄这一行,
# Spring Security 默认配置接管, 整个服务变成 HTTP Basic + 启动时随机生成的密码,
# 日志里那句 "This generated password is for development use only" 就是它。
# 表面看接口仍然返回 401, 与拦截器拒绝一模一样, 只有响应头里的
# `WWW-Authenticate: Basic realm="Realm"` 能分辨 —— 又一个只看状态码会看错的判据。
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration,\
  org.springframework.boot.actuate.autoconfigure.security.servlet.ManagementWebSecurityAutoConfiguration
