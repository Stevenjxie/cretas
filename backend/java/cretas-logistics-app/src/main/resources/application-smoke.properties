# 本地冒烟启动用。只回答一个问题: 脱离单体之后, 这个服务的 Spring 上下文还能不能装配起来。
# 用 H2 内存库而不是任何真实库 —— 这一步验的是装配, 不是 SQL, 而且不能有碰到真实数据的可能。
server.port=10031

spring.datasource.url=jdbc:h2:mem:logistics_smoke;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# 迁移脚本仍在 cretas-api 的 resources 里, 不在这个服务的 classpath 上。
# schema 拆分是独立部署真正贵的那一半, 不在这一步的范围内。
spring.flyway.enabled=false

cretas.jwt.secret=smoke_only_secret_at_least_32_characters_long_for_hs256
logging.level.root=WARN
logging.level.com.cretas=INFO
