# 物流独立服务的 PostgreSQL 配置 —— 真实部署形态。
#
# 与单体最要紧的差别: Flyway 只看 db/flyway-logistics。物流域的 12 个迁移随
# cretas-logistics.jar 走, 单体的 570 个不在这个服务的 classpath 上, 也不该在:
# 一个独立的物流库不需要工厂、BOM、报表那些表。
# 平台层的强制配置(排除 SecurityAutoConfiguration —— 本仓库鉴权走自己的拦截器链)。
# 不抄这一行的后果: Spring Security 默认接管, 服务变成 HTTP Basic + 随机密码。
spring.config.import=classpath:application-platform.properties

server.port=${SERVER_PORT:10031}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:cretas_logistics}
spring.datasource.username=${DB_USER:cretas_user}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# 与单体共用一个 PG 实例, 连接数要克制
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:5}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# update 而不是 validate: 这个服务目前仍依赖整个 cretas-model(500 个实体), 其中绝大多数
# 表不属于物流域也没有对应迁移。validate 会因为那些表不存在而启动失败。
# 这正说明 model 粒度太粗 —— 按域拆 model 是下一步, 拆完之后这里应当收紧回 validate。
# 默认 none: 这个服务会连到与单体同一个库, Hibernate 若按 500 个实体去 update
# schema, 动的是真实数据库的表结构。安全的默认值比方便的默认值重要。
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:none}
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/flyway-logistics
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=20260415.98
spring.flyway.baseline-description=Baseline before logistics module migrations
spring.flyway.validate-on-migrate=false
spring.flyway.out-of-order=false

cretas.jwt.secret=${JWT_SECRET}
logging.level.root=WARN
logging.level.com.cretas=INFO
logging.level.org.flywaydb=INFO
